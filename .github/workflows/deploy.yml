#!/usr/bin/env bash

set -euo pipefail

CLI="unikraft"

PHASE="${1:-}"

if [ -z "$PHASE" ]; then
    echo "用法：./deploy.sh prepare|build|deploy"
    exit 1
fi

echo ""
echo "======================================"
echo "      Firefox + Unikraft Cloud"
echo "======================================"

# ============================================================
# 基础参数
# ============================================================

PROJECT_RAW="${PROJECT_NAME:-firefox}"

NAME=$(printf '%s' "$PROJECT_RAW" \
    | tr '[:upper:]' '[:lower:]' \
    | sed 's/[^a-z0-9-]/-/g' \
    | sed 's/^-*//' \
    | sed 's/-*$//')

if [ -z "$NAME" ]; then
    NAME="firefox"
fi

REGIONS_RAW="${REGIONS:-sfo}"

# 兼容：
# sfo
# sfo,sin
# "sfo - 美国旧金山"
REGIONS=$(printf '%s' "$REGIONS_RAW" \
    | tr ',' ' ' \
    | sed 's/ -.*//' \
    | xargs)

MEMORY_MB="${MEMORY_MB:-1536}"

APP_PORT="${APP_PORT:-3000}"

echo "项目名称：$NAME"
echo "地区：$REGIONS"
echo "内存：${MEMORY_MB}MB"
echo "端口：$APP_PORT"

# ============================================================
# 登录 Unikraft
# ============================================================

login() {

    echo ""
    echo "--------------------------------------"
    echo "登录 Unikraft"
    echo "--------------------------------------"

    if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
        echo "错误：没有设置 UNIKRAFT_API_TOKEN"
        exit 1
    fi

    TOKEN="$UNIKRAFT_API_TOKEN"

    # --------------------------------------------------------
    # 从 token 中解析组织名称
    # --------------------------------------------------------

    ORG=""

    if printf '%s' "$TOKEN" | base64 -d >/tmp/unikraft-token-decoded 2>/dev/null; then

        ORG=$(cat /tmp/unikraft-token-decoded \
            | cut -d ':' -f1 \
            | sed 's/^robot\$//' \
            | sed 's/\.users\.kraftcloud$//' \
            | tr -d '\r\n')

    fi

    # 如果无法解析，则允许手动指定
    if [ -z "$ORG" ]; then

        if [ -n "${UNIKRAFT_ORG:-}" ]; then
            ORG="$UNIKRAFT_ORG"
        else
            echo "错误：无法从 UNIKRAFT_API_TOKEN 解析组织名称"
            echo "可以设置 UNIKRAFT_ORG"
            exit 1
        fi

    fi

    echo "认证组织：$ORG"

    # --------------------------------------------------------
    # 登录
    # --------------------------------------------------------

    printf '%s' "$TOKEN" | "$CLI" login \
        --token=- \
        --organization "$ORG"

    echo ""
    echo "登录成功"
    echo "组织：$ORG"

    # --------------------------------------------------------
    # 最重要：
    # 所有阶段统一使用这个镜像地址
    # --------------------------------------------------------

    IMAGE="unikraft.io/${ORG}/${NAME}:latest"

    echo ""
    echo "最终镜像：$IMAGE"

    export ORG
    export IMAGE
}

# ============================================================
# prepare
# ============================================================

prepare() {

    echo ""
    echo "======================================"
    echo "准备 Firefox Unikraft 镜像"
    echo "======================================"

    # --------------------------------------------------------
    # 检查 app
    # --------------------------------------------------------

    if [ ! -d "app" ]; then
        echo "错误：找不到 app/ 目录"
        echo ""
        echo "项目结构应该是："
        echo ""
        echo "app/"
        echo " ├── index.js"
        echo " └── package.json"
        echo ""
        exit 1
    fi

    # --------------------------------------------------------
    # Firefox Node 项目检查
    # --------------------------------------------------------

    if [ ! -f "app/index.js" ]; then
        echo "错误：找不到 app/index.js"
        exit 1
    fi

    if [ ! -f "app/package.json" ]; then
        echo "错误：找不到 app/package.json"
        exit 1
    fi

    echo "检测到 Node.js Firefox 项目"

    # --------------------------------------------------------
    # 清理旧构建
    # --------------------------------------------------------

    rm -rf _build

    mkdir -p _build/rootfs/app

    # --------------------------------------------------------
    # 下载 Node Alpine 基础 rootfs
    # --------------------------------------------------------

    echo ""
    echo "下载 Node.js 20 Alpine 基础镜像..."

    if [ ! -f "scripts/pull-base.py" ]; then
        echo "错误：找不到 scripts/pull-base.py"
        exit 1
    fi

    python3 scripts/pull-base.py \
        library/node \
        20-alpine \
        _build/rootfs

    # --------------------------------------------------------
    # 安装 Node 依赖
    # --------------------------------------------------------

    echo ""
    echo "安装 Firefox Node.js 依赖..."

    cd app

    npm install \
        --omit=dev \
        --no-audit \
        --no-fund

    cd ..

    # --------------------------------------------------------
    # 拷贝应用
    # --------------------------------------------------------

    echo ""
    echo "复制 Firefox 应用..."

    cp -a app/. _build/rootfs/app/

    # --------------------------------------------------------
    # 创建启动脚本
    # --------------------------------------------------------

    cat > _build/rootfs/app/start.sh <<'EOF'
#!/bin/sh

set -e

cd /app

echo "======================================"
echo "Firefox Node.js Application"
echo "======================================"

echo "Node：$(node --version)"

echo "目录："
ls -la /app || true

echo "启动 index.js..."

exec node /app/index.js
EOF

    chmod 755 _build/rootfs/app/start.sh

    # --------------------------------------------------------
    # 创建 Kraftfile
    # --------------------------------------------------------

    cat > _build/Kraftfile <<'EOF'
spec: v0.7

runtime: base-compat:latest

rootfs:
  source: ./rootfs
  format: erofs

cmd:
  - /bin/sh
  - /app/start.sh
EOF

    echo ""
    echo "======================================"
    echo "Kraftfile 创建完成"
    echo "======================================"

    echo ""
    echo "构建目录：_build"
    echo "启动命令：/bin/sh /app/start.sh"

    echo ""
    echo "Firefox 应用："
    echo "    /app/index.js"

    echo ""
    echo "HTTP 端口：$APP_PORT"

    echo ""
    echo "======================================"
    echo "prepare 完成"
    echo "======================================"
}

# ============================================================
# build
# ============================================================

build() {

    echo ""
    echo "======================================"
    echo "构建 Unikraft Firefox 镜像"
    echo "======================================"

    # --------------------------------------------------------
    # 登录
    # --------------------------------------------------------

    login

    # --------------------------------------------------------
    # 检查构建目录
    # --------------------------------------------------------

    if [ ! -d "_build/rootfs" ]; then

        echo "没有找到 _build/rootfs"

        echo ""
        echo "自动执行 prepare..."

        prepare

    fi

    # --------------------------------------------------------
    # 强制使用组织镜像
    #
    # 绝对不能使用：
    #
    # gggds:latest
    #
    # 否则 Unikraft 会默认变成：
    #
    # unikraft.io/official/gggds:latest
    #
    # --------------------------------------------------------

    IMAGE="unikraft.io/${ORG}/${NAME}:latest"

    echo ""
    echo "组织：$ORG"
    echo "项目：$NAME"
    echo "镜像：$IMAGE"

    echo ""
    echo "开始构建并推送镜像..."
    echo ""

    "$CLI" build \
        _build \
        --output "$IMAGE"

    echo ""
    echo "======================================"
    echo "镜像构建成功"
    echo "======================================"
    echo ""
    echo "镜像：$IMAGE"
    echo ""
}

# ============================================================
# deploy
# ============================================================

deploy() {

    echo ""
    echo "======================================"
    echo "部署 Firefox"
    echo "======================================"

    login

    IMAGE="unikraft.io/${ORG}/${NAME}:latest"

    echo ""
    echo "组织：$ORG"
    echo "项目：$NAME"
    echo "镜像：$IMAGE"
    echo "地区：$REGIONS"
    echo "内存：${MEMORY_MB}MB"
    echo "端口：$APP_PORT"

    # --------------------------------------------------------
    # 每个地区部署
    # --------------------------------------------------------

    for R in $REGIONS; do

        R=$(printf '%s' "$R" | xargs)

        if [ -z "$R" ]; then
            continue
        fi

        echo ""
        echo "======================================"
        echo "地区：$R"
        echo "======================================"

        SERVICE_NAME="${NAME}-${R}"

        # ----------------------------------------------------
        # 删除旧实例
        # ----------------------------------------------------

        echo ""
        echo "检查旧实例..."

        OLD_IDS=$(
            "$CLI" instances list -o json 2>/dev/null \
            | jq -r \
                --arg n "$NAME" \
                --arg r "$R" \
                '.[]
                 | select(.name==$n)
                 | select(.metro==$r)
                 | .uuid' \
            || true
        )

        if [ -n "$OLD_IDS" ]; then

            while read -r ID; do

                if [ -n "$ID" ]; then

                    echo "删除旧实例：$ID"

                    "$CLI" instances delete \
                        "$ID" \
                        --force \
                        >/dev/null 2>&1 \
                        || true

                fi

            done <<< "$OLD_IDS"

        else

            echo "没有旧实例"

        fi

        sleep 2

        # ----------------------------------------------------
        # 创建服务
        # ----------------------------------------------------

        echo ""
        echo "检查服务：$SERVICE_NAME"

        SERVICE_OUTPUT=""

        if SERVICE_OUTPUT=$(
            "$CLI" services create \
                --name "$SERVICE_NAME" \
                --metro "$R" \
                --services "443:${APP_PORT}/tls+http" \
                --services "80:443/http+redirect" \
                2>&1
        ); then

            echo "服务创建成功"

        else

            if printf '%s' "$SERVICE_OUTPUT" \
                | grep -qi \
                "already exists\|in use\|conflict"; then

                echo "服务已经存在，继续部署"

            else

                echo ""
                echo "服务创建失败："
                echo "$SERVICE_OUTPUT"

                exit 1

            fi

        fi

        # ----------------------------------------------------
        # 等待镜像同步
        # ----------------------------------------------------

        echo ""
        echo "启动 Firefox 实例..."

        SUCCESS=0

        LAST_OUTPUT=""

        for RETRY in 1 2 3 4 5 6 7 8; do

            echo ""
            echo "启动尝试：${RETRY}/8"

            LAST_OUTPUT=$(
                "$CLI" run \
                    --metro "$R" \
                    --name "$NAME" \
                    -m "${MEMORY_MB}M" \
                    --service "$SERVICE_NAME" \
                    --scale-to-zero policy=off \
                    -e "PORT=$APP_PORT" \
                    --image "$IMAGE" \
                    2>&1
            ) && {

                echo "$LAST_OUTPUT"

                SUCCESS=1

                break
            }

            echo "$LAST_OUTPUT"

            if printf '%s' "$LAST_OUTPUT" \
                | grep -qi \
                "No image\|image.*not found\|not found.*image"; then

                echo ""
                echo "镜像还没有同步到地区 $R"
                echo "等待 20 秒后重试..."

                sleep 20

            else

                echo ""
                echo "实例启动失败"

                break

            fi

        done

        # ----------------------------------------------------
        # 判断启动结果
        # ----------------------------------------------------

        if [ "$SUCCESS" != "1" ]; then

            echo ""
            echo "======================================"
            echo "地区 $R 部署失败"
            echo "======================================"

            echo "$LAST_OUTPUT"

            exit 1

        fi

        echo ""
        echo "地区 $R 实例创建成功"

    done

    # --------------------------------------------------------
    # 等待实例启动
    # --------------------------------------------------------

    echo ""
    echo "======================================"
    echo "等待 Firefox 实例启动"
    echo "======================================"

    sleep 5

    # --------------------------------------------------------
    # 输出最终信息
    # --------------------------------------------------------

    echo ""
    echo "======================================"
    echo "部署完成"
    echo "======================================"

    "$CLI" instances list -o json 2>/dev/null \
        | jq -r \
            --arg n "$NAME" \
            '.[]
             | select(.name==$n)
             | [
                 .metro,
                 .state,
                 (.services.domains[0].fqdn
                  // .domains[0].fqdn
                  // "?")
               ]
             | @tsv' \
        | while IFS=$'\t' read -r METRO STATE DOMAIN; do

            echo ""
            echo "地区：$METRO"
            echo "状态：$STATE"

            if [ "$DOMAIN" != "?" ]; then
                echo "地址：https://$DOMAIN"
            else
                echo "地址：暂未分配"
            fi

        done

    echo ""
    echo "======================================"
    echo "Firefox 部署流程结束"
    echo "======================================"
}

# ============================================================
# 主程序
# ============================================================

case "$PHASE" in

    prepare)
        prepare
        ;;

    build)
        build
        ;;

    deploy)
        deploy
        ;;

    *)
        echo ""
        echo "错误：未知阶段 $PHASE"
        echo ""
        echo "正确用法："
        echo ""
        echo "bash deploy.sh prepare"
        echo "bash deploy.sh build"
        echo "bash deploy.sh deploy"
        echo ""
        exit 1
        ;;

esac
