name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: firefox
  REGIONS: sfo
  MEMORY_MB: "1536"
  APP_PORT: "3000"

jobs:

  deploy:
    runs-on: ubuntu-24.04

    steps:

      # =====================================================
      # 1. 获取代码
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================================================
      # 2. 检查项目文件
      # =====================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            -print | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          echo "Firefox 项目文件检查通过"

      # =====================================================
      # 3. 安装真正的 KraftKit
      #
      # 注意：
      # 这里下载的是：
      #
      # kraft_版本_linux_amd64.tar.gz
      #
      # 不是 kraftkit_*.apk
      #
      # =====================================================

      - name: 安装 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          KRAFT_VERSION="v0.12.15"

          ARCH="$(uname -m)"

          if [ "$ARCH" != "x86_64" ]; then
            echo "错误：GitHub Runner 架构不是 amd64"
            echo "当前架构：$ARCH"
            exit 1
          fi

          mkdir -p "$HOME/.local/bin"

          URL="https://github.com/unikraft/kraftkit/releases/download/${KRAFT_VERSION}/kraft_${KRAFT_VERSION#v}_linux_amd64.tar.gz"

          echo ""
          echo "KraftKit 版本：$KRAFT_VERSION"
          echo "下载地址：$URL"
          echo ""

          rm -f /tmp/kraft.tar.gz

          curl -fL --retry 5 --retry-delay 3 \
            "$URL" \
            -o /tmp/kraft.tar.gz

          echo ""
          echo "下载完成："
          ls -lh /tmp/kraft.tar.gz

          echo ""
          echo "检查压缩包："
          file /tmp/kraft.tar.gz

          echo ""
          echo "压缩包内容："
          tar -tzf /tmp/kraft.tar.gz

          echo ""
          echo "解压 KraftKit..."

          rm -rf /tmp/kraft-extract
          mkdir -p /tmp/kraft-extract

          tar -xzf /tmp/kraft.tar.gz \
            -C /tmp/kraft-extract

          echo ""
          echo "解压后的文件："
          find /tmp/kraft-extract -maxdepth 3 -type f -print

          KRAFT_BIN="$(find /tmp/kraft-extract -type f -name kraft -print -quit)"

          if [ -z "$KRAFT_BIN" ]; then
            echo ""
            echo "错误：Release 压缩包中没有找到 kraft"
            exit 1
          fi

          echo ""
          echo "找到 Kraft：$KRAFT_BIN"

          cp "$KRAFT_BIN" "$HOME/.local/bin/kraft"

          chmod +x "$HOME/.local/bin/kraft"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "检查 ELF："
          file "$HOME/.local/bin/kraft"

          echo ""
          echo "检查架构："
          file "$HOME/.local/bin/kraft" | grep -E "x86-64|x86_64|AMD64"

          echo ""
          echo "检查 KraftKit 版本："
          "$HOME/.local/bin/kraft" version

          echo ""
          echo "======================================"
          echo "KraftKit 安装成功"
          echo "======================================"

      # =====================================================
      # 4. 登录 Unikraft
      # =====================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo "错误：没有设置 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "检查 Kraft："
          command -v kraft
          kraft version

          echo ""

          ORG="${UNIKRAFT_ORG:-}"

          if [ -z "$ORG" ]; then

            DECODED="$(printf '%s' "$UNIKRAFT_API_TOKEN" | base64 -d 2>/dev/null || true)"

            if [ -n "$DECODED" ]; then
              ORG="$(printf '%s' "$DECODED" \
                | cut -d ':' -f1 \
                | sed 's/^robot\$//' \
                | sed 's/\.users\.kraftcloud$//' \
                | tr -d '\r\n')"
            fi

          fi

          if [ -z "$ORG" ]; then
            echo "错误：无法解析 Unikraft Organization"
            echo "请在 GitHub Secrets 中设置：UNIKRAFT_ORG"
            exit 1
          fi

          echo "认证组织：$ORG"

          printf '%s' "$UNIKRAFT_API_TOKEN" \
            | kraft cloud login \
              --token=- \
              --organization "$ORG"

          echo ""
          echo "Unikraft 登录成功"

      # =====================================================
      # 5. 准备 rootfs
      # =====================================================

      - name: 准备 Firefox RootFS
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox RootFS"
          echo "======================================"

          rm -rf _build

          mkdir -p _build/rootfs

          echo ""
          echo "下载 Node.js 20 Alpine..."

          python3 scripts/pull-base.py \
            library/node \
            20-alpine \
            _build/rootfs

          echo ""
          echo "安装 Node.js 依赖..."

          cd app

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          cd ..

          echo ""
          echo "复制 Firefox 应用..."

          mkdir -p _build/rootfs/app

          cp -a app/. _build/rootfs/app/

          echo ""
          echo "创建启动脚本..."

          cat > _build/rootfs/app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          cd /app

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo "Node:"
          node --version

          echo ""
          echo "应用目录:"
          ls -lah /app

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod +x _build/rootfs/app/start.sh

          echo ""
          echo "创建 Kraftfile..."

          cat > _build/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./rootfs
            format: erofs

          cmd:
            - /bin/sh
            - /app/start.sh
          EOF

          echo ""
          echo "======================================"
          echo "RootFS 准备完成"
          echo "======================================"

          echo ""
          echo "Kraftfile："
          cat _build/Kraftfile

          echo ""
          echo "启动脚本："
          cat _build/rootfs/app/start.sh

      # =====================================================
      # 6. 构建镜像
      #
      # 关键：
      # 不再使用：
      #
      # --output firefox:latest
      #
      # 防止变成：
      #
      # unikraft.io/official/firefox
      #
      # =====================================================

      - name: 构建 Firefox 镜像
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          set -e

          echo "======================================"
          echo "构建 Unikraft Firefox 镜像"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo "错误：没有 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          ORG="${UNIKRAFT_ORG:-}"

          if [ -z "$ORG" ]; then
            DECODED="$(printf '%s' "$UNIKRAFT_API_TOKEN" | base64 -d 2>/dev/null || true)"

            if [ -n "$DECODED" ]; then
              ORG="$(printf '%s' "$DECODED" \
                | cut -d ':' -f1 \
                | sed 's/^robot\$//' \
                | sed 's/\.users\.kraftcloud$//' \
                | tr -d '\r\n')"
            fi
          fi

          if [ -z "$ORG" ]; then
            echo "错误：无法获取 Organization"
            exit 1
          fi

          NAME="$(printf '%s' "${PROJECT_NAME:-firefox}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$NAME" ]; then
            NAME="firefox"
          fi

          IMAGE="unikraft.io/${ORG}/${NAME}:latest"

          echo ""
          echo "Organization：$ORG"
          echo "项目名称：$NAME"
          echo "最终镜像：$IMAGE"

          echo ""
          echo "Kraft："
          kraft version

          echo ""
          echo "开始构建..."

          kraft build \
            _build \
            --output "$IMAGE"

          echo ""
          echo "======================================"
          echo "Firefox 镜像构建成功"
          echo "======================================"

          echo ""
          echo "IMAGE=$IMAGE"

      # =====================================================
      # 7. 部署
      # =====================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          REGIONS: ${{ env.REGIONS }}
          MEMORY_MB: ${{ env.MEMORY_MB }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          TOKEN="$UNIKRAFT_API_TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "错误：没有 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          ORG="${UNIKRAFT_ORG:-}"

          if [ -z "$ORG" ]; then

            DECODED="$(printf '%s' "$TOKEN" | base64 -d 2>/dev/null || true)"

            if [ -n "$DECODED" ]; then
              ORG="$(printf '%s' "$DECODED" \
                | cut -d ':' -f1 \
                | sed 's/^robot\$//' \
                | sed 's/\.users\.kraftcloud$//' \
                | tr -d '\r\n')"
            fi

          fi

          if [ -z "$ORG" ]; then
            echo "错误：无法获取 Organization"
            exit 1
          fi

          NAME="$(printf '%s' "${PROJECT_NAME:-firefox}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/^-*//' \
            | sed 's/-*$//')"

          if [ -z "$NAME" ]; then
            NAME="firefox"
          fi

          IMAGE="unikraft.io/${ORG}/${NAME}:latest"

          echo ""
          echo "组织：$ORG"
          echo "镜像：$IMAGE"
          echo "地区：$REGIONS"
          echo "内存：${MEMORY_MB}MB"
          echo "端口：$APP_PORT"

          # -------------------------------------------------
          # 登录
          # -------------------------------------------------

          printf '%s' "$TOKEN" \
            | kraft cloud login \
              --token=- \
              --organization "$ORG"

          # -------------------------------------------------
          # 地区转换
          # -------------------------------------------------

          REGION_LIST="$(printf '%s' "$REGIONS" \
            | tr ',' ' ' \
            | sed 's/ -.*//' \
            | xargs)"

          # -------------------------------------------------
          # 部署
          # -------------------------------------------------

          for R in $REGION_LIST; do

            echo ""
            echo "======================================"
            echo "地区：$R"
            echo "======================================"

            SERVICE_NAME="${NAME}-${R}"

            echo ""
            echo "创建/检查服务：$SERVICE_NAME"

            if ! kraft cloud service create \
              --name "$SERVICE_NAME" \
              --metro "$R" \
              --ports "443:${APP_PORT}/tls+http" \
              --ports "80:443/http+redirect" \
              2>&1; then

              echo "服务可能已经存在，继续..."

            fi

            echo ""
            echo "启动 Firefox..."

            kraft cloud instance run \
              --name "$NAME" \
              --metro "$R" \
              --memory "${MEMORY_MB}M" \
              --service "$SERVICE_NAME" \
              --image "$IMAGE"

            echo ""
            echo "实例创建完成"

          done

          echo ""
          echo "======================================"
          echo "部署完成"
          echo "======================================"

          echo ""
          echo "当前实例："

          kraft cloud instance list || true
