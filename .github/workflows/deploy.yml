name: Firefox Unikraft Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: "选择部署地区"
        required: true
        default: "sfo"
        type: choice
        options:
          - sfo
          - sin
          - fra

      project_name:
        description: "项目名称"
        required: true
        default: "firefox"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 拉取项目
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. 检查项目文件
      # =====================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          if [ ! -f "scripts/deploy.sh" ]; then
            echo "错误：找不到 scripts/deploy.sh"
            exit 1
          fi

          echo "======================================"
          echo "项目检查通过"
          echo "======================================"


      # =====================================================
      # 3. 安装 Node.js 依赖
      # =====================================================

      - name: 安装 Firefox 依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Firefox Node.js 依赖"
          echo "======================================"

          cd app

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          cd ..

          echo "依赖安装完成"


      # =====================================================
      # 4. 准备 rootfs
      # =====================================================

      - name: 准备 Firefox
        shell: bash
        env:
          APP_PORT: "3000"
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox Unikraft rootfs"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh prepare


      # =====================================================
      # 5. 安装 Unikraft CLI
      #
      # 不再使用 GitHub Release API
      # 不再猜 linux-amd64 文件名
      # 使用官方安装源
      # =====================================================

      - name: 安装 Unikraft CLI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          export PATH="$HOME/.local/bin:$HOME/bin:$HOME/.unikraft/bin:$PATH"

          echo ""
          echo "下载官方安装脚本..."

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -fsSL \
            https://unikraft.com/cli/install.sh \
            -o /tmp/unikraft-install.sh

          chmod +x /tmp/unikraft-install.sh

          echo ""
          echo "执行安装脚本..."

          sh /tmp/unikraft-install.sh

          echo ""
          echo "寻找 unikraft..."

          CLI_PATH=""

          for P in \
            "$HOME/.local/bin/unikraft" \
            "$HOME/bin/unikraft" \
            "$HOME/.unikraft/bin/unikraft" \
            "/usr/local/bin/unikraft" \
            "/usr/bin/unikraft"
          do

            if [ -x "$P" ]; then
              CLI_PATH="$P"
              break
            fi

          done

          if [ -z "$CLI_PATH" ]; then

            CLI_PATH="$(command -v unikraft 2>/dev/null || true)"

          fi

          if [ -z "$CLI_PATH" ]; then

            echo ""
            echo "❌ 找不到 unikraft CLI"

            echo ""
            echo "PATH："
            echo "$PATH"

            echo ""
            echo "搜索文件："

            find "$HOME" \
              -type f \
              -name "unikraft" \
              2>/dev/null || true

            exit 1

          fi

          CLI_DIR="$(dirname "$CLI_PATH")"

          echo ""
          echo "CLI：$CLI_PATH"
          echo "目录：$CLI_DIR"

          echo "$CLI_DIR" >> "$GITHUB_PATH"

          export PATH="$CLI_DIR:$PATH"

          echo ""
          echo "======================================"
          echo "检查 CLI"
          echo "======================================"

          command -v unikraft

          unikraft version || unikraft --version

          echo ""
          echo "======================================"
          echo "Unikraft CLI 安装成功"
          echo "======================================"


      # =====================================================
      # 6. 构建并推送 Firefox 镜像
      # =====================================================

      - name: 构建 Firefox 镜像
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          APP_PORT: "3000"
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$HOME/.unikraft/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh build


      # =====================================================
      # 7. 部署实例
      # =====================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          REGIONS: ${{ github.event.inputs.region }}
          MEMORY_MB: "1536"
          APP_PORT: "3000"
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$HOME/.unikraft/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh deploy
