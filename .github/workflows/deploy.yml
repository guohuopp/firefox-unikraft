name: Deploy Firefox to Unikraft Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  PROJECT_NAME: firefox
  APP_PORT: "3000"
  MEMORY: "1536MiB"
  METRO: "sin"

jobs:

  deploy:
    name: Build and Deploy Firefox
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 检出代码
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 显示项目结构
      # ============================================================

      - name: 检查项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          echo "Firefox 项目检查通过"

      # ============================================================
      # 3. 安装基础工具
      # ============================================================

      - name: 安装依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装构建依赖"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-pip \
            tar \
            xz-utils \
            gzip

          echo ""
          echo "依赖安装完成"

      # ============================================================
      # 4. 安装 KraftKit
      # ============================================================

      - name: 安装 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          KRAFT_VERSION="v0.12.15"

          mkdir -p "$HOME/.local/bin"

          DOWNLOAD_URL="https://github.com/unikraft/kraftkit/releases/download/${KRAFT_VERSION}/kraftkit_${KRAFT_VERSION#v}_linux_amd64.tar.gz"

          echo ""
          echo "KraftKit：$KRAFT_VERSION"
          echo ""
          echo "下载："
          echo "$DOWNLOAD_URL"

          rm -rf "$RUNNER_TEMP/kraftkit"

          mkdir -p "$RUNNER_TEMP/kraftkit"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$DOWNLOAD_URL" \
            -o "$RUNNER_TEMP/kraftkit.tar.gz"

          echo ""
          echo "下载完成："

          ls -lh "$RUNNER_TEMP/kraftkit.tar.gz"

          echo ""
          echo "解压 KraftKit..."

          tar -xzf \
            "$RUNNER_TEMP/kraftkit.tar.gz" \
            -C "$RUNNER_TEMP/kraftkit"

          echo ""
          echo "解压内容："

          find "$RUNNER_TEMP/kraftkit" -maxdepth 3 -type f -print

          KRAFT_BIN=""

          if [ -f "$RUNNER_TEMP/kraftkit/kraft" ]; then
            KRAFT_BIN="$RUNNER_TEMP/kraftkit/kraft"
          elif [ -f "$RUNNER_TEMP/kraftkit/kraftkit" ]; then
            KRAFT_BIN="$RUNNER_TEMP/kraftkit/kraftkit"
          else
            KRAFT_BIN=$(find "$RUNNER_TEMP/kraftkit" -type f \( -name "kraft" -o -name "kraftkit" \) | head -n 1 || true)
          fi

          if [ -z "$KRAFT_BIN" ]; then
            echo ""
            echo "错误：没有找到 KraftKit 可执行文件"
            exit 1
          fi

          chmod +x "$KRAFT_BIN"

          cp "$KRAFT_BIN" "$HOME/.local/bin/kraft"

          chmod +x "$HOME/.local/bin/kraft"

          export PATH="$HOME/.local/bin:$PATH"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo ""
          echo "检查 KraftKit："

          command -v kraft

          kraft --version

          echo ""
          echo "======================================"
          echo "KraftKit 安装成功"
          echo "======================================"

      # ============================================================
      # 5. 检查组织变量
      # ============================================================

      - name: 检查 Unikraft 配置
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
          UKC_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "检查 Unikraft Cloud 配置"
          echo "======================================"

          if [ -z "$UKC_ORG" ]; then
            echo ""
            echo "错误：没有设置 GitHub Repository Variable："
            echo "UNIKRAFT_ORG"
            echo ""
            echo "例如："
            echo "ggdbddhg"
            echo ""
            exit 1
          fi

          if [ -z "$UKC_TOKEN" ]; then
            echo ""
            echo "错误：没有设置 GitHub Repository Secret："
            echo "UNIKRAFT_API_TOKEN"
            echo ""
            exit 1
          fi

          echo ""
          echo "Unikraft 组织：$UKC_ORG"
          echo "API Token：已设置"
          echo "Metro：${METRO}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"

      # ============================================================
      # 6. 登录 Unikraft Cloud
      # ============================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
          UKC_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          echo ""
          echo "KraftKit："
          kraft --version

          echo ""
          echo "创建 Unikraft CLI 配置..."

          mkdir -p "$HOME/.config/unikraft"

          cat > "$HOME/.config/unikraft/config.yaml" <<EOF
          profiles:
            default:
              type: cloud
              token: ${UKC_TOKEN}
              organization: ${UKC_ORG}
          EOF

          chmod 600 "$HOME/.config/unikraft/config.yaml"

          echo ""
          echo "配置完成"

          echo ""
          echo "检查 Unikraft CLI..."

          if ! command -v unikraft >/dev/null 2>&1; then
            echo "错误：没有找到 unikraft CLI"
            echo "当前 KraftKit："
            kraft --version
            exit 1
          fi

          echo ""
          echo "unikraft："
          command -v unikraft

          unikraft --version

          echo ""
          echo "登录配置完成"

      # ============================================================
      # 7. 构建 Firefox 镜像
      # ============================================================

      - name: 构建 Firefox Unikraft 镜像
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          IMAGE="index.unikraft.io/${UKC_ORG}/firefox:latest"

          echo ""
          echo "组织：$UKC_ORG"
          echo "镜像：$IMAGE"

          echo ""
          echo "开始构建..."

          unikraft build . \
            --output "$IMAGE"

          echo ""
          echo "======================================"
          echo "Firefox 镜像构建成功"
          echo "======================================"

          echo ""
          echo "镜像：$IMAGE"

      # ============================================================
      # 8. 查看镜像
      # ============================================================

      - name: 检查镜像
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "检查 Unikraft 镜像"
          echo "======================================"

          unikraft images list || true

      # ============================================================
      # 9. 删除旧 Firefox 实例
      # ============================================================

      - name: 清理旧实例
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "清理旧 Firefox 实例"
          echo "======================================"

          echo ""
          echo "查询旧实例..."

          unikraft instances list || true

          echo ""
          echo "删除同名旧实例..."

          OLD_INSTANCES=$(
            unikraft instances list --output json 2>/dev/null \
            | jq -r '
                .[]
                | select(.name == "firefox")
                | .name
              ' \
            2>/dev/null \
            || true
          )

          if [ -n "$OLD_INSTANCES" ]; then

            echo "$OLD_INSTANCES" \
              | while read -r INSTANCE; do

                  if [ -n "$INSTANCE" ]; then
                    echo "删除：$INSTANCE"

                    unikraft instances delete "$INSTANCE" \
                      || true
                  fi

                done

          else

            echo "没有需要删除的旧实例"

          fi

          sleep 3

      # ============================================================
      # 10. 启动 Firefox
      # ============================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UKC_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          IMAGE="index.unikraft.io/${UKC_ORG}/firefox:latest"

          echo ""
          echo "镜像：$IMAGE"
          echo "地区：${METRO}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"

          echo ""
          echo "启动实例..."

          unikraft run \
            --metro "${METRO}" \
            --name firefox \
            --memory "${MEMORY}" \
            --publish "443:${APP_PORT}/http+tls" \
            --env "PORT=${APP_PORT}" \
            --restart always \
            --image "$IMAGE"

          echo ""
          echo "======================================"
          echo "Firefox 实例创建成功"
          echo "======================================"

      # ============================================================
      # 11. 等待实例启动
      # ============================================================

      - name: 等待 Firefox
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "等待 Firefox 启动"
          echo "======================================"

          for i in $(seq 1 18); do

            echo ""
            echo "检查 ${i}/18"

            OUTPUT=$(unikraft instances list 2>/dev/null || true)

            echo "$OUTPUT"

            if printf '%s\n' "$OUTPUT" | grep -q "firefox"; then

              if printf '%s\n' "$OUTPUT" | grep -Eq "running|starting"; then
                echo ""
                echo "Firefox 正在运行/启动"
                break
              fi

              if printf '%s\n' "$OUTPUT" | grep -q "stopped"; then
                echo ""
                echo "Firefox 实例已经停止"
                echo ""
                echo "详细信息："
                unikraft instances list || true
                exit 1
              fi

            fi

            sleep 10

          done

      # ============================================================
      # 12. 输出最终状态
      # ============================================================

      - name: 输出部署结果
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "======================================"
          echo "Firefox 部署完成"
          echo "======================================"

          echo ""
          echo "实例："

          unikraft instances list || true

          echo ""
          echo "镜像："

          unikraft images list || true

          echo ""
          echo "======================================"
          echo "完成"
          echo "======================================"
