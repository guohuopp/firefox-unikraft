name: Firefox Unikraft Deploy

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Firefox 应用名称"
        required: true
        default: "firefox"

      region:
        description: "Unikraft Cloud 地区"
        required: true
        default: "sfo"
        type: choice
        options:
          - sfo
          - sin
          - fra
          - sjc
          - dal
          - lhr

      memory:
        description: "内存"
        required: true
        default: "1536"
        type: choice
        options:
          - "1024"
          - "1536"
          - "2048"

  push:
    branches:
      - main

env:
  PROJECT_NAME: ${{ github.event.inputs.project_name || 'firefox' }}
  REGIONS: ${{ github.event.inputs.region || 'sfo' }}
  MEMORY_MB: ${{ github.event.inputs.memory || '1536' }}
  APP_PORT: "3000"

jobs:

  prepare:

    name: 准备 Firefox

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查项目文件
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/deploy.sh" ]; then
            echo "错误：找不到 scripts/deploy.sh"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          echo "Firefox 文件检查通过"

      - name: 安装 Python
        shell: bash
        run: |

          set -e

          python3 --version

      - name: 设置 deploy.sh 权限
        shell: bash
        run: |

          set -e

          chmod +x scripts/deploy.sh

          echo "deploy.sh 权限："
          ls -l scripts/deploy.sh

      - name: Prepare
        shell: bash
        run: |

          set -e

          export PROJECT_NAME="${PROJECT_NAME}"
          export REGIONS="${REGIONS}"
          export MEMORY_MB="${MEMORY_MB}"
          export APP_PORT="${APP_PORT}"

          bash scripts/deploy.sh prepare


  build:

    name: 构建 Firefox 镜像

    needs: prepare

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Unikraft CLI
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          curl -fsSL https://raw.githubusercontent.com/unikraft/kraftkit/staging/install.sh \
            -o /tmp/install-kraft.sh

          chmod +x /tmp/install-kraft.sh

          /tmp/install-kraft.sh

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          if [ -d "$HOME/.unikraft/bin" ]; then
            export PATH="$HOME/.unikraft/bin:$PATH"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          if [ -d "$HOME/.unikraft/bin" ]; then
            echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"
          fi

          echo ""
          echo "检查 CLI："

          command -v unikraft || command -v kraft

          echo ""
          echo "CLI 版本："

          unikraft version 2>/dev/null || \
          unikraft --version 2>/dev/null || \
          kraft version 2>/dev/null || \
          kraft --version

      - name: 构建 Firefox 镜像
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          REGIONS: ${{ env.REGIONS }}
          MEMORY_MB: ${{ env.MEMORY_MB }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |

          set -e

          echo "======================================"
          echo "构建 Firefox 镜像"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh build


  deploy:

    name: 部署 Firefox

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Unikraft CLI
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          curl -fsSL https://raw.githubusercontent.com/unikraft/kraftkit/staging/install.sh \
            -o /tmp/install-kraft.sh

          chmod +x /tmp/install-kraft.sh

          /tmp/install-kraft.sh

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          if [ -d "$HOME/.unikraft/bin" ]; then
            export PATH="$HOME/.unikraft/bin:$PATH"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          if [ -d "$HOME/.unikraft/bin" ]; then
            echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"
          fi

          echo ""
          echo "检查 CLI："

          command -v unikraft || command -v kraft

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          REGIONS: ${{ env.REGIONS }}
          MEMORY_MB: ${{ env.MEMORY_MB }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |

          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh deploy
