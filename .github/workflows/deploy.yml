name: Deploy Firefox to Unikraft Cloud

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: firefox
  REGIONS: sfo
  MEMORY_MB: 1536
  APP_PORT: 3000

jobs:

  deploy:
    name: Firefox Unikraft Deployment
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. 检查项目
      # ==========================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："

          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            -print \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          echo "Firefox 项目检查通过"


      # ==========================================================
      # 3. 安装构建依赖
      # ==========================================================

      - name: 安装构建依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装构建依赖"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            python3 \
            python3-pip \
            tar \
            gzip \
            xz-utils \
            ca-certificates

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "Python:"
          python3 --version


      # ==========================================================
      # 4. 直接下载 KraftKit
      #
      # 不使用：
      #
      # curl https://get.kraftkit.sh | sh
      #
      # 因为 GitHub Actions 是非交互环境，
      # 官方安装脚本可能调用 apt / /dev/tty。
      #
      # 这里直接从 GitHub Release 获取 Linux amd64 二进制。
      # ==========================================================

      - name: 安装 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          INSTALL_DIR="$HOME/.local/bin"

          mkdir -p "$INSTALL_DIR"

          echo ""
          echo "获取最新 KraftKit Release..."

          RELEASE_JSON="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              https://api.github.com/repos/unikraft/kraftkit/releases/latest
          )"

          TAG="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r '.tag_name'
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "错误：无法获取 KraftKit Release"
            exit 1
          fi

          echo "KraftKit Release：$TAG"

          echo ""
          echo "Release 文件："

          printf '%s' "$RELEASE_JSON" \
            | jq -r '.assets[].name'

          echo ""

          # ------------------------------------------------------
          # 寻找 Linux amd64 二进制
          # ------------------------------------------------------

          ASSET_URL="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r '
                .assets[]
                | select(
                    (.name | ascii_downcase | contains("linux"))
                    and
                    (
                      (.name | ascii_downcase | contains("amd64"))
                      or
                      (.name | ascii_downcase | contains("x86_64"))
                    )
                  )
                | .browser_download_url
              ' \
              | head -n 1
          )"

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then

            echo ""
            echo "没有找到 Linux amd64 资产"
            echo ""
            echo "尝试寻找 Linux x86_64 资产..."

            ASSET_URL="$(
              printf '%s' "$RELEASE_JSON" \
                | jq -r '
                  .assets[]
                  | select(
                      (.name | ascii_downcase | contains("linux"))
                    )
                  | .browser_download_url
                ' \
                | head -n 1
            )"

          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo ""
            echo "错误：KraftKit Release 中没有找到 Linux 二进制"
            exit 1
          fi

          echo "下载地址："
          echo "$ASSET_URL"

          echo ""

          TMP_DIR="$(mktemp -d)"

          cd "$TMP_DIR"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "$ASSET_URL" \
            -o kraftkit-download

          echo ""
          echo "下载完成："

          ls -lh kraftkit-download

          # ------------------------------------------------------
          # 判断下载的是压缩包还是直接二进制
          # ------------------------------------------------------

          FILE_TYPE="$(file kraftkit-download)"

          echo ""
          echo "文件类型："
          echo "$FILE_TYPE"

          if printf '%s' "$FILE_TYPE" | grep -qi "gzip"; then

            echo "检测到 gzip"

            gzip -dc kraftkit-download > kraft

          elif printf '%s' "$FILE_TYPE" | grep -qi "xz"; then

            echo "检测到 xz"

            xz -dc kraftkit-download > kraft

          elif printf '%s' "$FILE_TYPE" | grep -qi "tar"; then

            echo "检测到 tar 压缩包"

            mkdir extract

            tar -xf kraftkit-download -C extract

            FOUND="$(
              find extract \
                -type f \
                -name kraft \
                | head -n 1
            )"

            if [ -z "$FOUND" ]; then

              FOUND="$(
                find extract \
                  -type f \
                  -name 'kraft*' \
                  | head -n 1
              )"

            fi

            if [ -z "$FOUND" ]; then
              echo "错误：压缩包中找不到 kraft"
              exit 1
            fi

            cp "$FOUND" kraft

          else

            echo "按照 ELF 二进制处理"

            cp kraftkit-download kraft

          fi

          chmod +x kraft

          # ------------------------------------------------------
          # 验证 ELF
          # ------------------------------------------------------

          echo ""
          echo "检查 KraftKit ELF："

          file kraft

          # ------------------------------------------------------
          # 安装
          # ------------------------------------------------------

          cp kraft "$INSTALL_DIR/kraft"

          chmod +x "$INSTALL_DIR/kraft"

          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

          export PATH="$INSTALL_DIR:$PATH"

          echo ""
          echo "======================================"
          echo "KraftKit 安装完成"
          echo "======================================"

          echo ""
          echo "kraft 路径："

          command -v kraft

          echo ""
          echo "kraft 版本："

          kraft --version || kraft version


      # ==========================================================
      # 5. 登录 Unikraft Cloud
      # ==========================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo ""
            echo "错误：没有设置 UNIKRAFT_API_TOKEN"
            echo ""
            echo "请在："
            echo "GitHub → Settings → Secrets and variables"
            echo "→ Actions"
            echo ""
            echo "添加："
            echo "UNIKRAFT_API_TOKEN"
            exit 1
          fi

          export PATH="$HOME/.local/bin:$PATH"

          command -v kraft

          echo ""
          echo "登录中..."

          printf '%s' "$UNIKRAFT_API_TOKEN" \
            | kraft login --token=-

          echo ""
          echo "Unikraft Cloud 登录成功"


      # ==========================================================
      # 6. 准备 rootfs
      # ==========================================================

      - name: 准备 Firefox rootfs
        shell: bash
        env:
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox rootfs"
          echo "======================================"

          rm -rf _build

          mkdir -p _build/rootfs/app

          echo ""
          echo "下载 Node.js 20 Alpine..."

          python3 scripts/pull-base.py \
            library/node \
            20-alpine \
            _build/rootfs

          echo ""
          echo "Node.js rootfs 下载完成"

          echo ""
          echo "安装 Node.js 依赖..."

          cd app

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          cd ..

          echo ""
          echo "复制 Firefox 应用..."

          cp -a app/. _build/rootfs/app/

          # ------------------------------------------------------
          # 启动脚本
          # ------------------------------------------------------

          cat > _build/rootfs/app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          cd /app

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo "Node:"
          node --version

          echo ""
          echo "应用目录："

          ls -la /app

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod 755 _build/rootfs/app/start.sh

          # ------------------------------------------------------
          # Kraftfile
          # ------------------------------------------------------

          cat > _build/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./rootfs
            format: erofs

          cmd:
            - /bin/sh
            - /app/start.sh
          EOF

          echo ""
          echo "======================================"
          echo "rootfs 准备完成"
          echo "======================================"

          echo ""
          echo "Kraftfile："

          cat _build/Kraftfile

          echo ""
          echo "start.sh："

          cat _build/rootfs/app/start.sh


      # ==========================================================
      # 7. 构建
      # ==========================================================

      - name: 构建 Firefox
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          command -v kraft

          cd _build

          echo ""
          echo "执行：kraft build"

          kraft build

          echo ""
          echo "Firefox 构建完成"


      # ==========================================================
      # 8. 查看镜像
      # ==========================================================

      - name: 检查构建镜像
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "检查镜像"
          echo "======================================"

          kraft image list || true

          kraft pkg ls || true


      # ==========================================================
      # 9. 推送镜像
      # ==========================================================

      - name: 推送镜像到 Unikraft Cloud
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "推送 Firefox 镜像"
          echo "======================================"

          cd _build

          echo ""
          echo "执行 Cloud 镜像推送..."

          kraft cloud image push

          echo ""
          echo "镜像推送完成"


      # ==========================================================
      # 10. 创建服务
      # ==========================================================

      - name: 创建 Firefox 服务
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          REGIONS: ${{ env.REGIONS }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "创建 Firefox 服务"
          echo "======================================"

          SERVICE_NAME="${PROJECT_NAME}-service"

          echo "服务：$SERVICE_NAME"
          echo "地区：$REGIONS"

          if kraft cloud service create \
            --metro "$REGIONS" \
            --name "$SERVICE_NAME" \
            -p "443:${APP_PORT}/http+tls" \
            -p "80:443/http+redirect"
          then

            echo "服务创建成功"

          else

            echo "服务可能已经存在"
            echo "继续部署"

          fi


      # ==========================================================
      # 11. 部署实例
      # ==========================================================

      - name: 部署 Firefox 实例
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          REGIONS: ${{ env.REGIONS }}
          MEMORY_MB: ${{ env.MEMORY_MB }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox 实例"
          echo "======================================"

          echo "项目：$PROJECT_NAME"
          echo "地区：$REGIONS"
          echo "内存：${MEMORY_MB}MB"
          echo "端口：$APP_PORT"

          echo ""
          echo "Cloud 镜像："

          kraft cloud image list || true

          echo ""
          echo "开始创建实例..."

          kraft cloud \
            --metro "$REGIONS" \
            instance create \
            -M "${MEMORY_MB}M" \
            -S \
            "$PROJECT_NAME:latest"

          echo ""
          echo "======================================"
          echo "Firefox 实例创建成功"
          echo "======================================"


      # ==========================================================
      # 12. 查看最终状态
      # ==========================================================

      - name: 查看 Firefox 状态
        shell: bash
        env:
          REGIONS: ${{ env.REGIONS }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "Firefox 最终状态"
          echo "======================================"

          sleep 5

          kraft cloud \
            --metro "$REGIONS" \
            instance list || true

          echo ""
          echo "======================================"
          echo "部署流程完成"
          echo "======================================"
