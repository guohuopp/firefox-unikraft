name: Deploy Firefox to Unikraft Cloud

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: firefox
  REGIONS: sfo
  MEMORY_MB: 1536
  APP_PORT: 3000

jobs:

  deploy:
    name: Build and Deploy Firefox
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. 获取代码
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查项目
      # ==========================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          echo "Firefox 项目检查通过"

      # ==========================================================
      # 3. 安装基础工具
      # ==========================================================

      - name: 安装依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装构建依赖"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            python3 \
            python3-pip \
            tar \
            gzip \
            xz-utils \
            ca-certificates

          echo ""
          echo "Node.js："
          node --version

          echo ""
          echo "npm："
          npm --version

          echo ""
          echo "Python："
          python3 --version

      # ==========================================================
      # 4. 安装官方 KraftKit
      #
      # 官方当前安装方式：
      # https://get.kraftkit.sh
      #
      # CLI 命令：
      # kraft
      # ==========================================================

      - name: 安装 Unikraft CLI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          echo "使用 Unikraft 官方 KraftKit 安装程序"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sSfL \
            https://get.kraftkit.sh \
            | sh

          echo ""
          echo "安装程序执行完成"

          # 官方安装程序通常会安装到 ~/.local/bin
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          # 同时搜索可能的安装位置
          for DIR in \
            "$HOME/.local/bin" \
            "$HOME/bin" \
            "$HOME/.unikraft/bin" \
            "/usr/local/bin"
          do
            if [ -x "$DIR/kraft" ]; then
              export PATH="$DIR:$PATH"
              echo "$DIR" >> "$GITHUB_PATH"
            fi
          done

          # 查找 kraft
          KRAFT_PATH="$(find \
            "$HOME/.local/bin" \
            "$HOME/bin" \
            "$HOME/.unikraft/bin" \
            "/usr/local/bin" \
            -type f \
            -name kraft \
            -perm -111 \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -z "$KRAFT_PATH" ]; then
            echo ""
            echo "错误：没有找到 kraft CLI"
            echo ""
            echo "PATH："
            echo "$PATH"
            echo ""
            echo "Home 目录："
            find "$HOME" -maxdepth 4 -type f -name kraft 2>/dev/null || true
            exit 1
          fi

          KRAFT_DIR="$(dirname "$KRAFT_PATH")"

          echo ""
          echo "找到 KraftKit："
          echo "$KRAFT_PATH"

          echo "$KRAFT_DIR" >> "$GITHUB_PATH"

          export PATH="$KRAFT_DIR:$PATH"

          echo ""
          echo "检查 KraftKit："

          command -v kraft

          echo ""
          kraft --version || kraft version

          echo ""
          echo "======================================"
          echo "KraftKit 安装成功"
          echo "======================================"

      # ==========================================================
      # 5. 登录 Unikraft Cloud
      # ==========================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          if [ -z "${UKC_TOKEN:-}" ]; then
            echo "错误：GitHub Secrets 中没有 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          command -v kraft

          echo ""
          echo "执行 kraft login..."

          printf '%s' "$UKC_TOKEN" | kraft login --token=-

          echo ""
          echo "Unikraft Cloud 登录成功"

      # ==========================================================
      # 6. 准备 Firefox rootfs
      # ==========================================================

      - name: 准备 Firefox rootfs
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox rootfs"
          echo "======================================"

          rm -rf _build

          mkdir -p _build/rootfs/app

          echo ""
          echo "下载 Node.js 20 Alpine..."

          python3 scripts/pull-base.py \
            library/node \
            20-alpine \
            _build/rootfs

          echo ""
          echo "Node.js 基础 rootfs 下载完成"

          echo ""
          echo "安装 Firefox Node.js 依赖..."

          cd app

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          cd ..

          echo ""
          echo "复制 Firefox 应用..."

          cp -a app/. _build/rootfs/app/

          # ======================================================
          # 创建启动脚本
          # ======================================================

          cat > _build/rootfs/app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          cd /app

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo "Node:"
          node --version

          echo ""
          echo "应用目录:"
          ls -la /app

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod 755 _build/rootfs/app/start.sh

          # ======================================================
          # Kraftfile
          # ======================================================

          cat > _build/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./rootfs
            format: erofs

          cmd:
            - /bin/sh
            - /app/start.sh
          EOF

          echo ""
          echo "======================================"
          echo "rootfs 准备完成"
          echo "======================================"

          echo ""
          echo "Kraftfile："
          cat _build/Kraftfile

          echo ""
          echo "启动脚本："
          cat _build/rootfs/app/start.sh

      # ==========================================================
      # 7. 构建镜像
      #
      # 注意：
      # 不再使用 unikraft build
      # 使用官方 kraft CLI
      # ==========================================================

      - name: 构建 Firefox 镜像
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          command -v kraft

          echo ""
          echo "构建目录：_build"

          echo ""
          echo "执行 Kraft 构建..."

          cd _build

          kraft build

          echo ""
          echo "======================================"
          echo "本地镜像构建完成"
          echo "======================================"

      # ==========================================================
      # 8. 推送镜像到 Unikraft Cloud
      # ==========================================================

      - name: 推送 Firefox 镜像
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          echo "======================================"
          echo "推送 Firefox 镜像"
          echo "======================================"

          command -v kraft

          cd _build

          echo ""
          echo "查看本地镜像："

          kraft image list || true

          echo ""
          echo "推送到 Unikraft Cloud..."

          # 使用当前登录组织，不硬编码 official
          kraft cloud image push

          echo ""
          echo "======================================"
          echo "镜像推送完成"
          echo "======================================"

      # ==========================================================
      # 9. 创建服务
      # ==========================================================

      - name: 创建 Firefox 服务
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          UKC_METRO: ${{ env.REGIONS }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          echo "======================================"
          echo "创建 Firefox 服务"
          echo "======================================"

          SERVICE_NAME="${PROJECT_NAME}-service"

          echo "服务：$SERVICE_NAME"
          echo "地区：$UKC_METRO"

          # 如果服务已经存在，不让工作流失败
          if kraft cloud service create \
            --metro "$UKC_METRO" \
            --name "$SERVICE_NAME" \
            -p "443:${APP_PORT}/http+tls" \
            -p "80:443/http+redirect"
          then
            echo "服务创建成功"
          else
            echo "服务可能已经存在，继续"
          fi

      # ==========================================================
      # 10. 创建 Firefox 实例
      # ==========================================================

      - name: 部署 Firefox 实例
        shell: bash
        env:
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          MEMORY_MB: ${{ env.MEMORY_MB }}
          UKC_METRO: ${{ env.REGIONS }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          echo "地区：$UKC_METRO"
          echo "内存：${MEMORY_MB}MB"
          echo "端口：$APP_PORT"

          echo ""
          echo "查找 Firefox 镜像..."

          kraft cloud image list

          echo ""
          echo "查找已有实例..."

          kraft cloud \
            --metro "$UKC_METRO" \
            instance list || true

          echo ""
          echo "创建 Firefox 实例..."

          kraft cloud \
            --metro "$UKC_METRO" \
            instance create \
            -M "${MEMORY_MB}M" \
            -S \
            -p "443:${APP_PORT}/http+tls" \
            -p "80:443/http+redirect" \
            "${PROJECT_NAME}:latest"

          echo ""
          echo "======================================"
          echo "Firefox 实例创建完成"
          echo "======================================"

      # ==========================================================
      # 11. 查看实例
      # ==========================================================

      - name: 查看 Firefox 状态
        shell: bash
        env:
          UKC_METRO: ${{ env.REGIONS }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          echo "======================================"
          echo "Firefox 实例状态"
          echo "======================================"

          sleep 5

          kraft cloud \
            --metro "$UKC_METRO" \
            instance list

          echo ""
          echo "======================================"
          echo "部署完成"
          echo "======================================"
