name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"
  PROJECT_NAME: firefox
  REGION: sin
  MEMORY: 1536M
  APP_PORT: "3000"

jobs:

  build-and-deploy:

    name: Build and Deploy Firefox

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. 检查项目
      # ============================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . \
            -maxdepth 3 \
            -type f \
            -not -path './.git/*' \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "app/Kraftfile" ]; then
            echo "错误：找不到 app/Kraftfile"
            exit 1
          fi

          echo "Firefox 项目检查通过"

      # ============================================================
      # 3. 安装 Node.js
      # ============================================================

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ============================================================
      # 4. 安装 Firefox Node.js 依赖
      # ============================================================

      - name: 安装 Firefox 依赖
        shell: bash
        working-directory: app
        run: |
          set -e

          echo "======================================"
          echo "安装 Firefox Node.js 依赖"
          echo "======================================"

          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

          echo ""
          echo "Node.js 依赖安装完成"

      # ============================================================
      # 5. 安装 KraftKit
      #
      # 不再手动 curl Release 文件。
      # 使用官方 GitHub Action。
      # ============================================================

      - name: 安装 KraftKit
        uses: unikraft/kraftkit@v0.12.15

      # ============================================================
      # 6. 检查 KraftKit
      # ============================================================

      - name: 检查 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 KraftKit"
          echo "======================================"

          command -v kraft || true
          command -v unikraft || true

          echo ""

          if command -v kraft >/dev/null 2>&1; then
            echo "kraft："
            kraft --version || kraft version || true
          fi

          echo ""

          if command -v unikraft >/dev/null 2>&1; then
            echo "unikraft："
            unikraft --version || unikraft version || true
          fi

          echo ""

          echo "PATH："
          echo "$PATH"

      # ============================================================
      # 7. 检查 Unikraft Cloud Token
      # ============================================================

      - name: 检查 Cloud Token
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "检查 Unikraft Cloud Token"
          echo "======================================"

          if [ -n "${UKC_TOKEN:-}" ]; then
            echo "检测到 UKC_TOKEN"
          elif [ -n "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo "检测到 UNIKRAFT_API_TOKEN"
          else
            echo ""
            echo "错误：没有设置 Unikraft Cloud Token"
            echo ""
            echo "请在 GitHub："
            echo "Settings"
            echo "→ Secrets and variables"
            echo "→ Actions"
            echo "→ New repository secret"
            echo ""
            echo "创建："
            echo "UKC_TOKEN"
            echo ""
            exit 1
          fi

      # ============================================================
      # 8. 登录 Unikraft Cloud
      #
      # 新版 unikraft CLI 不再使用：
      #
      # --organization
      #
      # 也不使用旧的 kraft cloud 登录方式。
      #
      # 这里优先使用 UKC_TOKEN。
      # ============================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          TOKEN="${UKC_TOKEN:-${UNIKRAFT_API_TOKEN:-}}"

          if [ -z "$TOKEN" ]; then
            echo "错误：Cloud Token 为空"
            exit 1
          fi

          # ========================================================
          # 新 CLI
          #
          # 官方文档说明：
          # unikraft login
          #
          # 这里把 token 放入 stdin，避免 token 出现在命令参数中。
          # ========================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "使用 unikraft CLI"

            printf '%s\n' "$TOKEN" \
              | unikraft login --token-stdin

          elif command -v kraft >/dev/null 2>&1; then

            echo "使用 KraftKit CLI"

            export UKC_TOKEN="$TOKEN"

            echo "Cloud token 已设置"

          else

            echo "错误：找不到 unikraft 或 kraft"
            exit 1

          fi

          echo ""
          echo "Cloud 登录步骤完成"

      # ============================================================
      # 9. 准备 Kraftfile
      #
      # 我们直接使用 app/Kraftfile。
      # ============================================================

      - name: 检查 Kraftfile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Kraftfile"
          echo "======================================"

          cat app/Kraftfile

          echo ""

          echo "Kraftfile 检查完成"

      # ============================================================
      # 10. 构建 Firefox Unikraft 镜像
      # ============================================================

      - name: 构建 Firefox Unikraft 镜像
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo ""
            echo "错误：没有设置 GitHub Repository Variable："
            echo "UNIKRAFT_ORG"
            echo ""
            echo "例如："
            echo "ggdbddhg"
            echo ""
            exit 1
          fi

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo "组织：${UNIKRAFT_ORG}"
          echo "镜像：${IMAGE}"

          echo ""

          # ========================================================
          # 新版 CLI
          # ========================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "使用 unikraft build"

            cd app

            unikraft build . \
              --output "${IMAGE}"

          # ========================================================
          # 如果 Action 没有提供 unikraft，则使用 kraft。
          # ========================================================

          elif command -v kraft >/dev/null 2>&1; then

            echo "使用 kraft build"

            cd app

            kraft build . \
              --output "${IMAGE}"

          else

            echo "错误：没有找到构建 CLI"
            exit 1

          fi

          echo ""
          echo "======================================"
          echo "镜像构建完成"
          echo "======================================"
          echo ""
          echo "镜像：${IMAGE}"

      # ============================================================
      # 11. 部署 Firefox
      # ============================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：UNIKRAFT_ORG 未设置"
            exit 1
          fi

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo "组织：${UNIKRAFT_ORG}"
          echo "镜像：${IMAGE}"
          echo "地区：${REGION}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"

          echo ""

          # ========================================================
          # 新版 CLI
          #
          # 官方迁移文档：
          #
          # unikraft run
          #   --metro
          #   --publish
          #   --image
          #
          # ========================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "使用 unikraft run"

            unikraft run \
              --metro "${REGION}" \
              --publish "443:${APP_PORT}/http+tls" \
              --memory "${MEMORY}" \
              --image "${IMAGE}"

          elif command -v kraft >/dev/null 2>&1; then

            echo "使用 kraft cloud"

            export KRAFTKIT_NO_WARN_CLOUD_DEPRECATION=1

            kraft cloud deploy \
              --metro "${REGION}" \
              --publish "443:${APP_PORT}/http+tls" \
              --memory "${MEMORY}" \
              --image "${IMAGE}"

          else

            echo "错误：没有找到部署 CLI"
            exit 1

          fi

      # ============================================================
      # 12. 部署完成
      # ============================================================

      - name: 部署完成
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "Firefox Unikraft 部署完成"
          echo "======================================"
          echo ""
          echo "项目：${PROJECT_NAME}"
          echo "地区：${REGION}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"
          echo ""
          echo "请进入 Unikraft Cloud 控制台查看实例状态。"
          echo ""
