    - name: 安装 Unikraft CLI
      shell: bash
      run: |
        set -e

        echo "======================================"
        echo "安装 Unikraft CLI"
        echo "======================================"

        curl --proto '=https' --tlsv1.2 -fsSL \
          https://unikraft.com/cli/install.sh | sh

        echo "CLI 安装完成"

        # 安装脚本通常会放到 ~/.local/bin
        export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

        # 如果安装到了其他常见目录，加入 PATH
        if [ -d "$HOME/.unikraft/bin" ]; then
          export PATH="$HOME/.unikraft/bin:$PATH"
        fi

        # 持久化 PATH 给后面的 GitHub Actions step
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/bin" >> "$GITHUB_PATH"

        if [ -d "$HOME/.unikraft/bin" ]; then
          echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"
        fi

        echo "PATH=$PATH"

        echo "检查 unikraft："
        command -v unikraft

        echo "检查版本："
        unikraft version || unikraft --version

        echo "======================================"
        echo "Unikraft CLI 安装成功"
        echo "======================================"
