name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: firefox
  REGION: sin
  MEMORY: 1536M
  APP_PORT: "3000"
  KRAFTKIT_NO_WARN_CLOUD_DEPRECATION: "1"

jobs:

  deploy:

    name: Build and Deploy Firefox

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. 获取代码
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. 检查项目
      # ==========================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "app/Kraftfile" ]; then
            echo "错误：找不到 app/Kraftfile"
            exit 1
          fi

          echo ""
          echo "Firefox 项目检查通过"

      # ==========================================================
      # 3. 安装 Node.js 24
      #
      # 不使用 npm cache
      #
      # 避免：
      # cache-dependency-path
      # package-lock.json
      # 路径解析错误
      # ==========================================================

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ==========================================================
      # 4. 检查 Node.js
      # ==========================================================

      - name: 检查 Node.js
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Node.js"
          echo "======================================"

          node --version
          npm --version

          echo ""
          echo "Node.js 检查完成"

      # ==========================================================
      # 5. 安装 Firefox Node.js 依赖
      # ==========================================================

      - name: 安装 Firefox 依赖
        shell: bash
        working-directory: app
        run: |
          set -e

          echo "======================================"
          echo "安装 Firefox Node.js 依赖"
          echo "======================================"

          if [ -f "package-lock.json" ]; then

            echo "检测到 package-lock.json"

            npm ci \
              --omit=dev \
              --no-audit \
              --no-fund

          else

            echo "没有 package-lock.json"
            echo "使用 npm install"

            npm install \
              --omit=dev \
              --no-audit \
              --no-fund

          fi

          echo ""
          echo "依赖安装完成"

      # ==========================================================
      # 6. 安装 KraftKit
      #
      # 使用官方 GitHub Action
      #
      # 不再自己 curl 下载文件
      # ==========================================================

      - name: 安装 KraftKit
        uses: unikraft/kraftkit@v0.12.15

      # ==========================================================
      # 7. 检查 KraftKit
      # ==========================================================

      - name: 检查 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 KraftKit"
          echo "======================================"

          echo ""
          echo "PATH："
          echo "$PATH"

          echo ""

          if command -v unikraft >/dev/null 2>&1; then

            echo "unikraft："
            command -v unikraft

            echo ""

            unikraft --version || \
            unikraft version || \
            true

          fi

          echo ""

          if command -v kraft >/dev/null 2>&1; then

            echo "kraft："
            command -v kraft

            echo ""

            kraft --version || \
            kraft version || \
            true

          fi

          if ! command -v unikraft >/dev/null 2>&1 \
             && ! command -v kraft >/dev/null 2>&1; then

            echo ""
            echo "错误：没有找到 KraftKit CLI"
            exit 1

          fi

          echo ""
          echo "KraftKit 检查完成"

      # ==========================================================
      # 8. 检查 Unikraft Token
      # ==========================================================

      - name: 检查 Unikraft Token
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "检查 Unikraft Cloud Token"
          echo "======================================"

          if [ -n "${UKC_TOKEN:-}" ]; then

            echo "检测到 UKC_TOKEN"

          elif [ -n "${UNIKRAFT_API_TOKEN:-}" ]; then

            echo "检测到 UNIKRAFT_API_TOKEN"

          else

            echo ""
            echo "错误：没有设置 Unikraft Cloud Token"
            echo ""
            echo "请设置 GitHub Secret："
            echo ""
            echo "UKC_TOKEN"
            echo ""
            exit 1

          fi

      # ==========================================================
      # 9. 检查组织
      # ==========================================================

      - name: 检查 Unikraft 组织
        shell: bash
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "检查 Unikraft 组织"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then

            echo ""
            echo "错误：没有设置 GitHub Repository Variable："
            echo ""
            echo "UNIKRAFT_ORG"
            echo ""
            echo "例如："
            echo "ggdbddhg"
            echo ""

            exit 1

          fi

          echo "Unikraft Organization：${UNIKRAFT_ORG}"

      # ==========================================================
      # 10. 登录 Unikraft Cloud
      # ==========================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          TOKEN="${UKC_TOKEN:-${UNIKRAFT_API_TOKEN:-}}"

          if [ -z "$TOKEN" ]; then
            echo "错误：Token 为空"
            exit 1
          fi

          # ======================================================
          # 新版 unikraft CLI
          # ======================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "检测到新版 unikraft CLI"

            printf '%s\n' "$TOKEN" \
              | unikraft login --token-stdin

          else

            echo "未找到 unikraft CLI"

            # --------------------------------------------------
            # 兼容 KraftKit 旧 CLI
            # --------------------------------------------------

            if command -v kraft >/dev/null 2>&1; then

              echo "检测到 kraft CLI"

              export UKC_TOKEN="$TOKEN"

              echo "Token 已设置"

            else

              echo "错误：没有可用 CLI"
              exit 1

            fi

          fi

          echo ""
          echo "登录步骤完成"

      # ==========================================================
      # 11. 显示 Kraftfile
      # ==========================================================

      - name: 检查 Kraftfile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Kraftfile"
          echo "======================================"

          echo ""

          cat app/Kraftfile

          echo ""

          echo "Kraftfile 检查完成"

      # ==========================================================
      # 12. 构建镜像
      # ==========================================================

      - name: 构建 Firefox Unikraft 镜像
        shell: bash
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：UNIKRAFT_ORG 未设置"
            exit 1
          fi

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo ""
          echo "组织：${UNIKRAFT_ORG}"
          echo "项目：${PROJECT_NAME}"
          echo "镜像：${IMAGE}"

          echo ""

          cd app

          # ======================================================
          # 新版 CLI
          # ======================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "使用 unikraft build"

            unikraft build . \
              --output "${IMAGE}"

          # ======================================================
          # 兼容旧 CLI
          # ======================================================

          elif command -v kraft >/dev/null 2>&1; then

            echo "使用 kraft build"

            kraft build . \
              --output "${IMAGE}"

          else

            echo "错误：没有找到构建 CLI"
            exit 1

          fi

          echo ""
          echo "======================================"
          echo "镜像构建完成"
          echo "======================================"
          echo ""
          echo "镜像：${IMAGE}"

      # ==========================================================
      # 13. 部署 Firefox
      # ==========================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：UNIKRAFT_ORG 未设置"
            exit 1
          fi

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo ""
          echo "组织：${UNIKRAFT_ORG}"
          echo "镜像：${IMAGE}"
          echo "地区：${REGION}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"

          echo ""

          # ======================================================
          # 新版 CLI
          # ======================================================

          if command -v unikraft >/dev/null 2>&1; then

            echo "使用新版 unikraft CLI"

            unikraft run \
              --metro "${REGION}" \
              --memory "${MEMORY}" \
              --publish "443:${APP_PORT}/http+tls" \
              --image "${IMAGE}"

          # ======================================================
          # 旧版兼容
          # ======================================================

          elif command -v kraft >/dev/null 2>&1; then

            echo "使用 kraft cloud"

            export KRAFTKIT_NO_WARN_CLOUD_DEPRECATION=1

            kraft cloud deploy \
              --metro "${REGION}" \
              --memory "${MEMORY}" \
              --publish "443:${APP_PORT}/http+tls" \
              --image "${IMAGE}"

          else

            echo "错误：没有找到部署 CLI"
            exit 1

          fi

      # ==========================================================
      # 14. 完成
      # ==========================================================

      - name: 部署完成
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "Firefox Unikraft 部署完成"
          echo "======================================"

          echo ""
          echo "项目：${PROJECT_NAME}"
          echo "地区：${REGION}"
          echo "内存：${MEMORY}"
          echo "端口：${APP_PORT}"

          echo ""

          echo "如果实例正常启动，"
          echo "Unikraft Cloud 会显示对应的 *.unikraft.app 地址。"

          echo ""
          echo "======================================"
