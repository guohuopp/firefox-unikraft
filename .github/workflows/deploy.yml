name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  KRAFTKIT_VERSION: "v0.12.15"
  PROJECT_NAME: "firefox"
  APP_PORT: "3000"
  MEMORY_MB: "1536"
  REGIONS: "sin"

jobs:

  deploy:
    name: Build and Deploy Firefox
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 检出代码
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. 检查项目结构
      # =====================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          echo "Firefox Node 项目检查通过"


      # =====================================================
      # 3. 创建根目录 Kraftfile
      # =====================================================

      - name: 创建 Kraftfile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建根目录 Kraftfile"
          echo "======================================"

          cat > Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./app
            format: erofs

          cmd: ["/bin/sh", "/app/start.sh"]
          EOF

          echo ""
          echo "Kraftfile 内容："
          cat Kraftfile

          echo ""

          if [ ! -f "Kraftfile" ]; then
            echo "错误：Kraftfile 创建失败"
            exit 1
          fi

          echo "Kraftfile 创建成功"


      # =====================================================
      # 4. 创建 Firefox 启动脚本
      # =====================================================

      - name: 创建 Firefox 启动脚本
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Firefox 启动脚本"
          echo "======================================"

          cat > app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo "Node:"
          node --version

          echo ""
          echo "应用目录:"
          ls -la /app

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod +x app/start.sh

          echo ""
          echo "启动脚本："
          cat app/start.sh

          echo ""
          echo "启动脚本权限："
          ls -l app/start.sh


      # =====================================================
      # 5. 安装 Node.js
      # =====================================================

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # =====================================================
      # 6. 安装 Firefox Node 依赖
      # =====================================================

      - name: 安装 Node.js 依赖
        shell: bash
        working-directory: app
        run: |
          set -e

          echo "======================================"
          echo "安装 Node.js 依赖"
          echo "======================================"

          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

          echo ""
          echo "依赖安装完成"


      # =====================================================
      # 7. 检查 Kraftfile
      # =====================================================

      - name: 最终检查构建目录
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "最终检查"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "Kraftfile："
          ls -lah Kraftfile

          echo ""
          echo "app："
          ls -lah app

          echo ""
          echo "Kraftfile 内容："
          cat Kraftfile

          echo ""

          test -f Kraftfile
          test -f app/index.js
          test -f app/package.json
          test -f app/start.sh

          echo ""
          echo "所有构建文件检查通过"


      # =====================================================
      # 8. 安装 KraftKit
      # =====================================================

      - name: 安装 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          VERSION="${KRAFTKIT_VERSION}"

          echo "KraftKit：${VERSION}"

          API="https://api.github.com/repos/unikraft/kraftkit/releases/tags/${VERSION}"

          echo ""
          echo "获取 Release..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API" \
            -o /tmp/kraftkit-release.json

          echo ""
          echo "寻找 Linux AMD64 TAR..."

          DOWNLOAD_URL="$(
            python3 - <<'PY'
          import json

          with open("/tmp/kraftkit-release.json", "r") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if (
                  "linux_amd64.tar.gz" in name
                  and name.startswith("kraft_")
              ):
                  print(url)
                  break
          PY
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：没有找到 KraftKit Linux AMD64 TAR"
            echo ""
            echo "Release 文件："

            python3 - <<'PY'
          import json

          with open("/tmp/kraftkit-release.json", "r") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              print(asset.get("name", ""))
          PY

            exit 1
          fi

          echo ""
          echo "下载地址："
          echo "$DOWNLOAD_URL"

          mkdir -p "$HOME/.local/bin"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$DOWNLOAD_URL" \
            -o /tmp/kraftkit.tar.gz

          echo ""
          echo "解压 KraftKit..."

          mkdir -p /tmp/kraftkit

          tar -xzf \
            /tmp/kraftkit.tar.gz \
            -C /tmp/kraftkit

          echo ""
          echo "解压内容："
          find /tmp/kraftkit -maxdepth 3 -type f -print

          KRAFT_BINARY="$(
            find /tmp/kraftkit \
              -type f \
              -name kraft \
              | head -n 1
          )"

          if [ -z "$KRAFT_BINARY" ]; then
            echo "错误：解压后找不到 kraft"
            exit 1
          fi

          cp "$KRAFT_BINARY" "$HOME/.local/bin/kraft"

          chmod +x "$HOME/.local/bin/kraft"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "Kraft 路径："
          command -v kraft

          echo ""
          echo "Kraft 版本："
          kraft version


      # =====================================================
      # 9. 检查 KraftKit
      # =====================================================

      - name: 检查 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 KraftKit"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          command -v kraft

          kraft version

          echo ""
          echo "检查 Kraftfile："

          if [ ! -f "$GITHUB_WORKSPACE/Kraftfile" ]; then
            echo "错误：没有 Kraftfile"
            exit 1
          fi

          ls -lah "$GITHUB_WORKSPACE/Kraftfile"

          echo ""
          echo "当前工作目录："
          pwd

          echo ""
          echo "Kraftfile："
          cat "$GITHUB_WORKSPACE/Kraftfile"


      # =====================================================
      # 10. 登录 Unikraft Cloud
      # =====================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo "错误：没有设置 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：没有设置 GitHub Repository Variable："
            echo "UNIKRAFT_ORG"
            echo ""
            echo "例如："
            echo "ggdbddhg"
            exit 1
          fi

          echo "认证组织：${UNIKRAFT_ORG}"

          echo ""
          echo "使用 Kraft 登录..."

          printf '%s' "$UNIKRAFT_API_TOKEN" \
            | kraft cloud login \
                --token-stdin \
                --organization "$UNIKRAFT_ORG"

          echo ""
          echo "登录完成"


      # =====================================================
      # 11. 构建镜像
      # =====================================================

      - name: 构建 Firefox Unikraft 镜像
        shell: bash
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：没有设置 UNIKRAFT_ORG"
            exit 1
          fi

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo ""
          echo "组织：${UNIKRAFT_ORG}"
          echo "项目：${PROJECT_NAME}"
          echo "镜像：${IMAGE}"

          echo ""
          echo "确认 Kraftfile："

          test -f Kraftfile

          cat Kraftfile

          echo ""
          echo "开始构建..."

          kraft build \
            --as "$IMAGE"

          echo ""
          echo "======================================"
          echo "镜像构建完成"
          echo "======================================"
          echo "镜像：${IMAGE}"


      # =====================================================
      # 12. 部署
      # =====================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          export PATH="$HOME/.local/bin:$PATH"

          IMAGE="unikraft.io/${UNIKRAFT_ORG}/${PROJECT_NAME}:latest"

          echo ""
          echo "镜像：${IMAGE}"
          echo "地区：${REGIONS}"
          echo "内存：${MEMORY_MB}MB"
          echo "端口：${APP_PORT}"

          echo ""
          echo "开始部署..."

          kraft cloud deploy \
            "$IMAGE" \
            --metro "$REGIONS" \
            --memory "${MEMORY_MB}M" \
            --port "${APP_PORT}"

          echo ""
          echo "======================================"
          echo "Firefox 部署完成"
          echo "======================================"
