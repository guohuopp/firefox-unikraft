name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  KRAFTKIT_VERSION: "v0.12.15"
  UNIKRAFT_ORG: "ggdbddhg"
  PROJECT_NAME: "firefox"
  APP_PORT: "3000"
  MEMORY_MB: "1536"
  REGIONS: "sin"

jobs:
  deploy:
    name: Firefox Unikraft
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo "当前目录:"
          pwd

          echo ""
          echo "项目文件:"
          find . -maxdepth 3 -type f | sort

          echo ""

          test -f app/index.js
          test -f app/package.json

          echo "Firefox 项目检查通过"

      - name: 创建根目录 Kraftfile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Kraftfile"
          echo "======================================"

          printf '%s\n' \
            'spec: v0.7' \
            '' \
            'runtime: base-compat:latest' \
            '' \
            'rootfs:' \
            '  source: ./app' \
            '  format: erofs' \
            '' \
            'cmd: ["/bin/sh", "/app/start.sh"]' \
            > Kraftfile

          echo ""
          cat Kraftfile

          test -f Kraftfile

          echo ""
          echo "Kraftfile 创建成功"

      - name: 创建启动脚本
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Firefox 启动脚本"
          echo "======================================"

          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            '' \
            'echo "======================================"' \
            'echo "Firefox + Node.js"' \
            'echo "======================================"' \
            '' \
            'echo "Node:"' \
            'node --version' \
            '' \
            'echo "应用目录:"' \
            'ls -lah /app' \
            '' \
            'echo "启动 Firefox Node 服务..."' \
            'exec node /app/index.js' \
            > app/start.sh

          chmod 755 app/start.sh

          echo ""
          cat app/start.sh

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Node.js 依赖
        shell: bash
        working-directory: app
        run: |
          set -e

          echo "======================================"
          echo "安装 Node.js 依赖"
          echo "======================================"

          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          else
            npm install --omit=dev --no-audit --no-fund
          fi

          echo ""
          echo "依赖安装完成"

      - name: 安装 KraftKit
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          VERSION="${KRAFTKIT_VERSION}"

          echo "版本: ${VERSION}"

          API="https://api.github.com/repos/unikraft/kraftkit/releases/tags/${VERSION}"

          echo ""
          echo "获取 Release..."

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            "${API}" \
            -o /tmp/kraftkit-release.json

          echo ""
          echo "寻找 Linux AMD64 TAR..."

          DOWNLOAD_URL=$(python3 -c '
          import json
          data = json.load(open("/tmp/kraftkit-release.json"))
          found = ""
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")
              if name == "kraft_0.12.15_linux_amd64.tar.gz":
                  found = url
                  break
              if name == "kraftkit_0.12.15_linux_amd64.tar.gz":
                  found = url
                  break
          print(found)
          ')

          if [ -z "${DOWNLOAD_URL}" ]; then
            echo "错误：没有找到 Linux AMD64 KraftKit"
            echo ""
            echo "Release 文件:"
            python3 -c '
          import json
          data = json.load(open("/tmp/kraftkit-release.json"))
          for asset in data.get("assets", []):
              print(asset.get("name", ""))
          '
            exit 1
          fi

          echo ""
          echo "下载地址:"
          echo "${DOWNLOAD_URL}"

          mkdir -p "${HOME}/.local/bin"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "${DOWNLOAD_URL}" \
            -o /tmp/kraftkit.tar.gz

          echo ""
          echo "下载完成:"
          ls -lh /tmp/kraftkit.tar.gz

          rm -rf /tmp/kraftkit

          mkdir -p /tmp/kraftkit

          echo ""
          echo "解压 KraftKit..."

          tar \
            -xzf /tmp/kraftkit.tar.gz \
            -C /tmp/kraftkit

          echo ""
          echo "寻找 kraft..."

          KRAFT_BINARY=$(find /tmp/kraftkit -type f -name kraft | head -n 1)

          if [ -z "${KRAFT_BINARY}" ]; then
            echo "错误：没有找到 kraft"
            find /tmp/kraftkit -maxdepth 2 -type f -print
            exit 1
          fi

          echo ""
          echo "找到 Kraft:"
          echo "${KRAFT_BINARY}"

          cp "${KRAFT_BINARY}" "${HOME}/.local/bin/kraft"

          chmod 755 "${HOME}/.local/bin/kraft"

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          export PATH="${HOME}/.local/bin:${PATH}"

          echo ""
          echo "Kraft 路径:"
          command -v kraft

          echo ""
          echo "Kraft 版本:"
          kraft version

      - name: 检查 KraftKit Cloud
        shell: bash
        run: |
          set -e

          export PATH="${HOME}/.local/bin:${PATH}"

          echo "======================================"
          echo "检查 KraftKit Cloud"
          echo "======================================"

          echo ""
          echo "Kraft:"
          command -v kraft

          echo ""
          kraft version

          echo ""
          echo "检查 cloud 命令:"
          kraft cloud --help

          echo ""
          echo "检查 cloud login:"
          kraft cloud login --help

          echo ""
          echo "检查 cloud build:"
          kraft cloud build --help || true

          echo ""
          echo "检查 cloud deploy:"
          kraft cloud deploy --help || true

          echo ""
          echo "======================================"
          echo "CLI 检查完成"
          echo "======================================"

      - name: 最终检查
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "最终项目检查"
          echo "======================================"

          echo ""
          echo "根目录:"
          ls -lah

          echo ""
          echo "Kraftfile:"
          ls -lah Kraftfile

          echo ""
          cat Kraftfile

          echo ""
          echo "app:"
          ls -lah app

          echo ""
          echo "检查完成"

      - name: 输出部署参数
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Firefox Unikraft 配置"
          echo "======================================"

          echo "组织: ${UNIKRAFT_ORG}"
          echo "项目: ${PROJECT_NAME}"
          echo "地区: ${REGIONS}"
          echo "内存: ${MEMORY_MB} MB"
          echo "端口: ${APP_PORT}"

          echo ""
          echo "本次运行先完成 CLI 验证。"

          echo "======================================"
          echo "准备完成"
          echo "======================================"
