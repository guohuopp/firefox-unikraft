name: Firefox - Unikraft Cloud

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

env:
  PROJECT_NAME: firefox
  APP_PORT: "3000"
  MEMORY: "1536M"
  FIREFOX_VERSION: "154.0.1"

jobs:

  deploy:
    name: Build and Deploy Firefox
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout Firefox project
        uses: actions/checkout@v4

      # ============================================================
      # 2. 显示项目结构
      # ============================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            -print | sort

          echo ""
          echo "======================================"

          test -f app/index.js
          test -f app/package.json
          test -f app/Kraftfile

          echo "Firefox 项目文件检查通过"

      # ============================================================
      # 3. 安装基础工具
      # ============================================================

      - name: 安装构建依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装构建依赖"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            tar \
            xz-utils \
            gzip \
            file \
            ca-certificates \
            python3 \
            python3-pip

          echo ""
          echo "依赖安装完成"

      # ============================================================
      # 4. 安装 KraftKit
      # ============================================================

      - name: 安装 KraftKit 0.12.15
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 KraftKit 0.12.15"
          echo "======================================"

          VERSION="0.12.15"

          INSTALL_DIR="$HOME/.local/bin"

          mkdir -p "$INSTALL_DIR"

          echo ""
          echo "下载 KraftKit：v${VERSION}"

          URL="https://github.com/unikraft/kraftkit/releases/download/v${VERSION}/kraft_${VERSION}_linux_amd64.tar.gz"

          echo ""
          echo "下载地址："
          echo "$URL"

          rm -rf /tmp/kraftkit
          mkdir -p /tmp/kraftkit

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o /tmp/kraftkit.tar.gz

          echo ""
          echo "下载完成："

          ls -lh /tmp/kraftkit.tar.gz

          echo ""
          echo "解压 KraftKit..."

          tar -xzf \
            /tmp/kraftkit.tar.gz \
            -C /tmp/kraftkit

          echo ""
          echo "解压内容："

          find /tmp/kraftkit -maxdepth 3 -type f -print

          KRAFT_BIN=""

          if [ -f "/tmp/kraftkit/kraft" ]; then
            KRAFT_BIN="/tmp/kraftkit/kraft"
          else
            KRAFT_BIN=$(find /tmp/kraftkit -type f -name kraft | head -n 1 || true)
          fi

          if [ -z "$KRAFT_BIN" ]; then
            echo ""
            echo "错误：没有找到 kraft 二进制文件"
            exit 1
          fi

          echo ""
          echo "Kraft 二进制："
          echo "$KRAFT_BIN"

          file "$KRAFT_BIN"

          chmod +x "$KRAFT_BIN"

          cp "$KRAFT_BIN" "$INSTALL_DIR/kraft"

          chmod +x "$INSTALL_DIR/kraft"

          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

          export PATH="$INSTALL_DIR:$PATH"

          echo ""
          echo "======================================"
          echo "KraftKit 安装完成"
          echo "======================================"

          command -v kraft

          kraft version

      # ============================================================
      # 5. 检查 Kraft CLI
      # ============================================================

      - name: 检查 Kraft CLI
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "检查 Kraft CLI"
          echo "======================================"

          command -v kraft

          echo ""
          echo "版本："

          kraft version

          echo ""
          echo "Build 帮助："

          kraft build --help | head -80 || true

          echo ""
          echo "Package 帮助："

          kraft pkg --help | head -80 || true

          echo ""
          echo "Kraft CLI 检查完成"

      # ============================================================
      # 6. Firefox 项目准备
      # ============================================================

      - name: 准备 Firefox 应用
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox 应用"
          echo "======================================"

          cd app

          echo ""
          echo "Node.js："
          node --version

          echo ""
          echo "npm："
          npm --version

          echo ""
          echo "安装 npm 依赖..."

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          echo ""
          echo "依赖安装完成"

          echo ""
          echo "app 文件："

          ls -lah

          echo ""
          echo "Firefox 应用准备完成"

      # ============================================================
      # 7. 创建部署目录
      # ============================================================

      - name: 创建 Unikraft 构建目录
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Unikraft 构建目录"
          echo "======================================"

          rm -rf _build

          mkdir -p _build/rootfs/app

          cp -a app/. _build/rootfs/app/

          echo ""
          echo "构建目录："

          find _build -maxdepth 3 -type f -print | sort

      # ============================================================
      # 8. 创建启动脚本
      # ============================================================

      - name: 创建 Firefox 启动脚本
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Firefox 启动脚本"
          echo "======================================"

          cat > _build/rootfs/app/start.sh <<'EOF'
          #!/bin/sh

          set -eu

          cd /app

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo "Node:"
          node --version

          echo ""
          echo "应用目录："
          ls -lah /app

          echo ""
          echo "PORT=${PORT:-3000}"

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod +x _build/rootfs/app/start.sh

          echo ""
          echo "start.sh："

          cat _build/rootfs/app/start.sh

      # ============================================================
      # 9. 创建 Kraftfile
      # ============================================================

      - name: 创建 Kraftfile
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建 Kraftfile"
          echo "======================================"

          cat > _build/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./rootfs
            format: erofs

          cmd: ["/bin/sh", "/app/start.sh"]
          EOF

          echo ""
          echo "Kraftfile："

          cat _build/Kraftfile

      # ============================================================
      # 10. 获取 Unikraft Token
      # ============================================================

      - name: 检查 Unikraft Cloud Token
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "检查 Unikraft Cloud Token"
          echo "======================================"

          if [ -z "${UNIKRAFT_API_TOKEN:-}" ]; then
            echo ""
            echo "错误：GitHub Secrets 中没有："
            echo ""
            echo "UNIKRAFT_API_TOKEN"
            echo ""
            exit 1
          fi

          echo "UNIKRAFT_API_TOKEN 已设置"

      # ============================================================
      # 11. 配置 Legacy Kraft Cloud 环境
      #
      # 注意：
      # 这里不执行 kraft cloud login。
      #
      # GitHub Actions 使用 token 非交互认证。
      # ============================================================

      - name: 配置 Unikraft Cloud
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_METRO: ${{ vars.UNIKRAFT_METRO }}
        run: |
          set -e

          echo "======================================"
          echo "配置 Unikraft Cloud"
          echo "======================================"

          METRO="${UNIKRAFT_METRO:-sfo}"

          echo "Metro：$METRO"

          export UKC_TOKEN="$UNIKRAFT_API_TOKEN"
          export UKC_METRO="$METRO"

          echo "UKC_TOKEN 已设置"
          echo "UKC_METRO=$UKC_METRO"

          echo ""
          echo "认证配置完成"

      # ============================================================
      # 12. 构建镜像
      # ============================================================

      - name: 构建 Firefox Unikraft 镜像
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_METRO: ${{ vars.UNIKRAFT_METRO }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo ""
            echo "错误：没有设置 GitHub Repository Variable："
            echo ""
            echo "UNIKRAFT_ORG"
            echo ""
            echo "例如："
            echo "ggdbddhg"
            echo ""
            exit 1
          fi

          IMAGE="index.unikraft.io/${UNIKRAFT_ORG}/firefox:latest"

          echo ""
          echo "组织：$UNIKRAFT_ORG"
          echo "镜像：$IMAGE"

          export UKC_TOKEN="$UNIKRAFT_API_TOKEN"
          export UKC_METRO="${UNIKRAFT_METRO:-sfo}"

          echo ""
          echo "开始构建..."

          kraft pkg \
            --plat kraftcloud \
            --arch x86_64 \
            --name "$IMAGE" \
            --push \
            _build

          echo ""
          echo "======================================"
          echo "镜像构建完成"
          echo "======================================"

          echo "镜像：$IMAGE"

      # ============================================================
      # 13. 部署 Firefox
      # ============================================================

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_METRO: ${{ vars.UNIKRAFT_METRO }}
          UNIKRAFT_ORG: ${{ vars.UNIKRAFT_ORG }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          if [ -z "${UNIKRAFT_ORG:-}" ]; then
            echo "错误：UNIKRAFT_ORG 未设置"
            exit 1
          fi

          METRO="${UNIKRAFT_METRO:-sfo}"

          IMAGE="index.unikraft.io/${UNIKRAFT_ORG}/firefox:latest"

          echo ""
          echo "组织：$UNIKRAFT_ORG"
          echo "Metro：$METRO"
          echo "镜像：$IMAGE"
          echo "内存：${MEMORY}M"
          echo "端口：$APP_PORT"

          export UKC_TOKEN="$UNIKRAFT_API_TOKEN"
          export UKC_METRO="$METRO"

          echo ""
          echo "启动 Firefox 实例..."

          kraft cloud instance create \
            --metro "$METRO" \
            --name firefox \
            --memory "${MEMORY}" \
            --port "443:${APP_PORT}/tls+http" \
            --restart-policy never \
            "$IMAGE"

      # ============================================================
      # 14. 部署完成
      # ============================================================

      - name: 部署完成
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_METRO: ${{ vars.UNIKRAFT_METRO }}
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          METRO="${UNIKRAFT_METRO:-sfo}"

          export UKC_TOKEN="$UNIKRAFT_API_TOKEN"
          export UKC_METRO="$METRO"

          echo ""
          echo "======================================"
          echo "Firefox 部署完成"
          echo "======================================"

          echo ""
          echo "查看实例："

          kraft cloud instance list || true

          echo ""
          echo "======================================"
          echo "Firefox 正在启动"
          echo "======================================"

          echo ""
          echo "请在 Unikraft Cloud 控制台查看实例域名。"
