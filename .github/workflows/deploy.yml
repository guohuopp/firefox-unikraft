name: Firefox Unikraft Deploy

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  KRAFTKIT_VERSION: "v0.12.15"

  # 你的 Unikraft Cloud 组织
  UNIKRAFT_ORG: "ggdbddhg"

  # Firefox 项目名称
  PROJECT_NAME: "firefox"

  # HTTP 服务端口
  APP_PORT: "3000"

  # 内存
  MEMORY_MB: "1536"

  # 部署地区
  REGIONS: "sin"


jobs:

  deploy:

    name: Firefox + Unikraft Cloud

    runs-on: ubuntu-latest


    steps:

      # ==================================================
      # 1. 获取代码
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. 检查项目
      # ==================================================

      - name: 检查 Firefox 项目
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："

          find . -maxdepth 3 -type f | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          echo ""
          echo "Firefox 项目检查通过"


      # ==================================================
      # 3. 创建根目录 Kraftfile
      # ==================================================

      - name: 创建 Kraftfile
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "创建 Kraftfile"
          echo "======================================"

          cat > Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./app
            format: erofs

          cmd: ["/bin/sh", "/app/start.sh"]
          EOF

          echo ""
          echo "Kraftfile："

          cat Kraftfile

          echo ""

          if [ ! -f "Kraftfile" ]; then
            echo "错误：Kraftfile 创建失败"
            exit 1
          fi

          echo "Kraftfile 创建成功"


      # ==================================================
      # 4. 创建启动脚本
      # ==================================================

      - name: 创建启动脚本
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "创建 Firefox 启动脚本"
          echo "======================================"

          cat > app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          echo "======================================"
          echo "Firefox + Node.js"
          echo "======================================"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "应用目录："

          ls -lah /app

          echo ""
          echo "启动 Firefox Node 服务..."

          exec node /app/index.js
          EOF

          chmod 755 app/start.sh

          echo ""
          echo "启动脚本："

          cat app/start.sh

          echo ""
          echo "权限："

          ls -lah app/start.sh


      # ==================================================
      # 5. Node.js 24
      # ==================================================

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ==================================================
      # 6. 安装 Node 依赖
      # ==================================================

      - name: 安装 Node.js 依赖
        shell: bash
        working-directory: app
        run: |

          set -e

          echo "======================================"
          echo "安装 Node.js 依赖"
          echo "======================================"

          if [ -f "package-lock.json" ]; then

            npm ci \
              --omit=dev \
              --no-audit \
              --no-fund

          else

            npm install \
              --omit=dev \
              --no-audit \
              --no-fund

          fi

          echo ""
          echo "Node.js 依赖安装完成"


      # ==================================================
      # 7. 最终检查
      # ==================================================

      - name: 检查构建文件
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "检查构建文件"
          echo "======================================"

          echo ""
          echo "当前目录："

          pwd

          echo ""
          echo "Kraftfile："

          ls -lah Kraftfile

          echo ""
          echo "app："

          ls -lah app

          echo ""
          echo "Kraftfile 内容："

          cat Kraftfile

          echo ""

          test -f Kraftfile
          test -f app/index.js
          test -f app/package.json
          test -f app/start.sh

          echo ""
          echo "所有文件检查通过"


      # ==================================================
      # 8. 安装 KraftKit
      # ==================================================

      - name: 安装 KraftKit
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "安装 KraftKit"
          echo "======================================"

          VERSION="${KRAFTKIT_VERSION}"

          echo "KraftKit：${VERSION}"

          API="https://api.github.com/repos/unikraft/kraftkit/releases/tags/${VERSION}"

          echo ""
          echo "获取 KraftKit Release..."

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            -H "Accept: application/vnd.github+json" \
            "$API" \
            -o /tmp/kraftkit-release.json

          echo ""
          echo "寻找 Linux AMD64 TAR..."

          DOWNLOAD_URL="$(
            python3 - <<'PY'
          import json

          with open("/tmp/kraftkit-release.json", "r") as f:
              data = json.load(f)

          for asset in data.get("assets", []):

              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")

              if name == "kraftkit_0.12.15_linux_amd64.tar.gz":
                  print(url)
                  break

              if name == "kraft_0.12.15_linux_amd64.tar.gz":
                  print(url)
                  break
          PY
          )"

          if [ -z "$DOWNLOAD_URL" ]; then

            echo ""
            echo "错误：没有找到 Linux AMD64 KraftKit"

            echo ""
            echo "Release 文件："

            python3 - <<'PY'
          import json

          with open("/tmp/kraftkit-release.json", "r") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              print(asset.get("name", ""))
          PY

            exit 1

          fi

          echo ""
          echo "下载地址："
          echo "$DOWNLOAD_URL"

          mkdir -p "$HOME/.local/bin"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "$DOWNLOAD_URL" \
            -o /tmp/kraftkit.tar.gz

          echo ""
          echo "下载完成："

          ls -lh /tmp/kraftkit.tar.gz

          echo ""
          echo "解压 KraftKit..."

          rm -rf /tmp/kraftkit

          mkdir -p /tmp/kraftkit

          tar \
            -xzf /tmp/kraftkit.tar.gz \
            -C /tmp/kraftkit

          echo ""
          echo "解压内容："

          find /tmp/kraftkit \
            -maxdepth 3 \
            -type f \
            -print

          KRAFT_BINARY="$(
            find /tmp/kraftkit \
              -type f \
              -name kraft \
              | head -n 1
          )"

          if [ -z "$KRAFT_BINARY" ]; then

            echo ""
            echo "错误：找不到 kraft 可执行文件"

            exit 1

          fi

          echo ""
          echo "找到 Kraft："
          echo "$KRAFT_BINARY"

          cp \
            "$KRAFT_BINARY" \
            "$HOME
