name: Firefox - Unikraft Cloud

on:
  workflow_dispatch:
    inputs:
      region:
        description: "部署区域"
        required: true
        default: "sfo"
        type: choice
        options:
          - sfo
          - sin
          - fra

      app_name:
        description: "应用名称（留空自动生成）"
        required: false
        default: ""

      memory:
        description: "内存"
        required: true
        default: "1536"
        type: choice
        options:
          - "1024"
          - "1536"
          - "2048"

env:
  PORT: "3000"

jobs:
  deploy:
    name: Build and Deploy Firefox
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. 安装基础工具
      # =====================================================

      - name: 安装基础工具
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装基础工具"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            python3 \
            python3-pip \
            xz-utils \
            tar \
            gzip \
            coreutils

          echo "基础工具安装完成"


      # =====================================================
      # 3. 安装 Unikraft CLI
      # =====================================================

      - name: 安装 Unikraft CLI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            https://unikraft.com/cli/install.sh \
            -o /tmp/unikraft-install.sh

          chmod +x /tmp/unikraft-install.sh

          /tmp/unikraft-install.sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$HOME/bin:$HOME/.unikraft/bin:$PATH"

          echo "搜索 unikraft CLI..."

          if command -v unikraft >/dev/null 2>&1; then
            echo "CLI：$(command -v unikraft)"
          else
            echo "❌ 找不到 unikraft CLI"

            find "$HOME" \
              -type f \
              -name unikraft \
              -perm -111 \
              2>/dev/null \
              | head -20 || true

            exit 1
          fi

          unikraft version || unikraft --version

          echo "======================================"
          echo "CLI 安装完成"
          echo "======================================"


      # =====================================================
      # 4. 设置项目参数
      # =====================================================

      - name: 设置参数
        shell: bash
        run: |
          set -e

          REGION="${{ github.event.inputs.region }}"
          MEMORY="${{ github.event.inputs.memory }}"
          INPUT_NAME="${{ github.event.inputs.app_name }}"

          RANDOM_NAME="$(date +%s%N | sha256sum | cut -c1-8)"

          if [ -n "$INPUT_NAME" ]; then
            APP_NAME="$(printf '%s' "$INPUT_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9-]/-/g' \
              | sed 's/^-*//' \
              | sed 's/-*$//')"
          else
            APP_NAME="firefox-${RANDOM_NAME}"
          fi

          if [ -z "$APP_NAME" ]; then
            APP_NAME="firefox-${RANDOM_NAME}"
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "REGION=$REGION" >> "$GITHUB_ENV"
          echo "MEMORY=$MEMORY" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "Firefox + Unikraft Cloud"
          echo "======================================"
          echo "项目名称：$APP_NAME"
          echo "地区：$REGION"
          echo "内存：${MEMORY}MB"
          echo "端口：3000"
          echo "======================================"


      # =====================================================
      # 5. 登录 Unikraft
      # =====================================================

      - name: 登录 Unikraft Cloud
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "登录 Unikraft Cloud"
          echo "======================================"

          if [ -z "$UNIKRAFT_API_TOKEN" ]; then
            echo "❌ 缺少 UNIKRAFT_API_TOKEN"
            exit 1
          fi

          ORG=""

          ORG="$(printf '%s' "$UNIKRAFT_API_TOKEN" \
            | base64 -d 2>/dev/null \
            | cut -d: -f1 \
            | sed 's/^robot\$//' \
            | sed 's/\.users\.kraftcloud$//' \
            || true)"

          if [ -n "$ORG" ]; then

            echo "认证组织：$ORG"

            printf '%s' "$UNIKRAFT_API_TOKEN" \
              | unikraft login \
                --token=- \
                --organization "$ORG"

          else

            echo "未能解析组织名称，使用 Token 登录"

            printf '%s' "$UNIKRAFT_API_TOKEN" \
              | unikraft login --token=-

          fi

          echo ""
          echo "登录完成"

          unikraft whoami || true


      # =====================================================
      # 6. 创建构建目录
      # =====================================================

      - name: 创建构建目录
        shell: bash
        run: |
          set -e

          rm -rf _build

          mkdir -p _build/rootfs

          echo "构建目录创建完成"


      # =====================================================
      # 7. 下载 Firefox Docker 镜像 rootfs
      # =====================================================

      - name: 获取 Firefox 镜像
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "获取 Firefox 镜像"
          echo "======================================"

          chmod +x scripts/pull-base.py

          python3 scripts/pull-base.py \
            eooce/firefox \
            latest \
            _build/rootfs

          echo ""
          echo "Firefox rootfs 获取完成"

          echo ""
          echo "检查 Firefox 文件："

          find _build/rootfs \
            -type f \
            -name firefox \
            -o \
            -type f \
            -name firefox-bin \
            | head -20 || true


      # =====================================================
      # 8. 创建 Firefox 启动脚本
      # =====================================================

      - name: 创建 Firefox 启动脚本
        shell: bash
        run: |
          set -e

          mkdir -p _build/rootfs/app

          cat > _build/rootfs/app/start.sh <<'EOF'
          #!/bin/sh

          set -e

          export HOME=/app

          FIREFOX=""

          for P in \
            /opt/firefox/firefox/firefox \
            /app/firefox/firefox/firefox \
            /firefox/firefox/firefox \
            /usr/lib/firefox/firefox \
            /usr/bin/firefox
          do
            if [ -x "$P" ]; then
              FIREFOX="$P"
              break
            fi
          done

          if [ -z "$FIREFOX" ]; then
            echo "Firefox executable not found"

            echo "Searching..."

            find / \
              -type f \
              -name firefox \
              -perm -111 \
              2>/dev/null \
              | head -20 || true

            exit 1
          fi

          echo "Firefox executable:"
          echo "$FIREFOX"

          mkdir -p /app/firefox-profile

          exec "$FIREFOX" \
            --headless \
            --no-remote \
            --profile /app/firefox-profile \
            --width 1280 \
            --height 720 \
            about:blank
          EOF

          chmod +x _build/rootfs/app/start.sh

          echo "启动脚本创建完成"


      # =====================================================
      # 9. 创建 Kraftfile
      # =====================================================

      - name: 创建 Kraftfile
        shell: bash
        run: |
          set -e

          cat > _build/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./rootfs
            format: erofs

          cmd:
            - /bin/sh
            - /app/start.sh
          EOF

          echo "======================================"
          echo "Kraftfile"
          echo "======================================"

          cat _build/Kraftfile


      # =====================================================
      # 10. 构建 Unikraft 镜像
      # =====================================================

      - name: 构建 Unikraft 镜像
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "构建 Unikraft Firefox 镜像"
          echo "======================================"

          IMAGE="$APP_NAME:latest"

          echo "镜像：$IMAGE"

          unikraft build \
            _build \
            --output "$IMAGE"

          echo ""
          echo "Unikraft 镜像构建完成"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"


      # =====================================================
      # 11. 创建服务
      # =====================================================

      - name: 创建服务
        shell: bash
        run: |
          set -e

          SERVICE="${APP_NAME}-${REGION}"

          echo "======================================"
          echo "创建服务"
          echo "======================================"

          echo "服务：$SERVICE"
          echo "地区：$REGION"

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"

          set +e

          OUTPUT="$(unikraft services create \
            --name "$SERVICE" \
            --metro "$REGION" \
            --services "443:3000/tls+http" \
            --services "80:443/http+redirect" \
            2>&1)"

          RESULT=$?

          set -e

          echo "$OUTPUT"

          if [ "$RESULT" -ne 0 ]; then

            if echo "$OUTPUT" | grep -Eiq \
              "already exists|in use|conflict"; then

              echo "服务已存在，继续"

            else

              echo "❌ 服务创建失败"
              exit 1

            fi

          fi


      # =====================================================
      # 12. 部署实例
      # =====================================================

      - name: 部署 Firefox
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          echo "镜像：$IMAGE"
          echo "地区：$REGION"
          echo "内存：${MEMORY}MB"
          echo "服务：$SERVICE"

          unikraft run \
            --metro "$REGION" \
            --name "$APP_NAME" \
            --memory "${MEMORY}M" \
            --service "$SERVICE" \
            --scale-to-zero policy=off \
            -e "PORT=3000" \
            --image "$IMAGE"

          echo ""
          echo "实例创建完成"


      # =====================================================
      # 13. 等待实例
      # =====================================================

      - name: 等待实例
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "等待 Firefox 实例"
          echo "======================================"

          for i in $(seq 1 12); do

            echo ""
            echo "检查 $i/12"

            DATA="$(unikraft instances list -o json 2>/dev/null || true)"

            echo "$DATA" \
              | jq -r \
              --arg NAME "$APP_NAME" \
              '.[] |
              select(.name == $NAME) |
              "地区=\(.metro) 状态=\(.state)"' \
              || true

            STATE="$(echo "$DATA" \
              | jq -r \
              --arg NAME "$APP_NAME" \
              '.[] |
              select(.name == $NAME) |
              .state' \
              | head -n 1)"

            if [ "$STATE" = "running" ]; then

              echo ""
              echo "✅ Firefox 正在运行"
              exit 0

            fi

            if [ "$STATE" = "stopped" ]; then

              echo ""
              echo "❌ Firefox 实例停止"

              echo ""
              echo "实例详细信息："

              echo "$DATA" \
                | jq \
                --arg NAME "$APP_NAME" \
                '.[] |
                select(.name == $NAME)' \
                || true

              exit 1

            fi

            sleep 5

          done

          echo ""
          echo "⚠️ 未能在等待时间内确认 running"
          echo "继续输出实例状态"


      # =====================================================
      # 14. 输出最终地址
      # =====================================================

      - name: 输出 Firefox 地址
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "Firefox 部署结果"
          echo "======================================"

          DATA="$(unikraft instances list -o json)"

          echo "$DATA" \
            | jq -r \
            --arg NAME "$APP_NAME" \
            '.[] |
            select(.name == $NAME) |
            "地区：\(.metro)
          状态：\(.state)
          UUID：\(.uuid)
          镜像：\(.image)
          地址：https://\(.domains[0].fqdn // .fqdn // "?")"'

          echo ""
          echo "======================================"
          echo "部署完成"
          echo "======================================"
