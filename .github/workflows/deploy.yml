name: Firefox Unikraft Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: "部署地区"
        required: true
        default: "sfo"
        type: choice
        options:
          - sfo
          - sin
          - fra
      project_name:
        description: "项目名称"
        required: true
        default: "firefox"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查项目
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Firefox 项目"
          echo "======================================"

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

          echo ""

          if [ ! -f "app/index.js" ]; then
            echo "错误：找不到 app/index.js"
            exit 1
          fi

          if [ ! -f "app/package.json" ]; then
            echo "错误：找不到 app/package.json"
            exit 1
          fi

          if [ ! -f "scripts/pull-base.py" ]; then
            echo "错误：找不到 scripts/pull-base.py"
            exit 1
          fi

          if [ ! -f "scripts/deploy.sh" ]; then
            echo "错误：找不到 scripts/deploy.sh"
            echo "请确认 scripts/deploy.sh 已经提交到 GitHub"
            exit 1
          fi

          echo "项目文件检查通过"

      - name: 安装依赖
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Node.js"
          echo "======================================"

          node --version
          npm --version

          cd app

          npm install \
            --omit=dev \
            --no-audit \
            --no-fund

          cd ..

          echo "Node.js 依赖安装完成"

      - name: 准备 Firefox rootfs
        shell: bash
        env:
          APP_PORT: "3000"
        run: |
          set -e

          echo "======================================"
          echo "准备 Firefox"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh prepare

      - name: 安装 Unikraft CLI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 Unikraft CLI"
          echo "======================================"

          if command -v unikraft >/dev/null 2>&1; then
            echo "Unikraft CLI 已存在"
          else
            echo "从 GitHub Release 安装 Unikraft CLI"

            LATEST_URL=$(
              curl -fsSL \
                https://api.github.com/repos/unikraft/cli/releases/latest \
                | grep '"browser_download_url"' \
                | grep 'linux-amd64' \
                | head -n 1 \
                | cut -d '"' -f 4
            )

            if [ -z "$LATEST_URL" ]; then
              echo "无法获取 Unikraft CLI 下载地址"
              exit 1
            fi

            echo "下载：$LATEST_URL"

            mkdir -p "$HOME/.local/bin"

            curl -fL \
              "$LATEST_URL" \
              -o /tmp/unikraft-cli

            chmod +x /tmp/unikraft-cli

            install \
              /tmp/unikraft-cli \
              "$HOME/.local/bin/unikraft"

            echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            export PATH="$HOME/.local/bin:$PATH"
          fi

          export PATH="$HOME/.local/bin:$PATH"

          echo ""
          echo "Unikraft CLI："
          command -v unikraft

          echo ""
          echo "版本："
          unikraft version || unikraft --version

      - name: 构建 Firefox 镜像
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          APP_PORT: "3000"
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "构建 Firefox Unikraft 镜像"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh build

      - name: 部署 Firefox
        shell: bash
        env:
          UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
          UNIKRAFT_ORG: ${{ secrets.UNIKRAFT_ORG }}
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          REGIONS: ${{ github.event.inputs.region }}
          MEMORY_MB: "1536"
          APP_PORT: "3000"
        run: |
          set -e

          export PATH="$HOME/.local/bin:$PATH"

          echo "======================================"
          echo "部署 Firefox"
          echo "======================================"

          chmod +x scripts/deploy.sh

          bash scripts/deploy.sh deploy
